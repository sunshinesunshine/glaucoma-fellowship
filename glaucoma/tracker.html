<script>
  try {
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
            },
            colors: {
              'midnight-base': '#0b0f19',
              'glass-surface': 'rgba(17, 24, 39, 0.65)',
              'ss-accent': '#3b82f6',
              'mn-accent': '#f97316',
              'status-muted': '#94a3b8',
              'slate-text': '#e2e8f0',
              slate: {
                950: '#070a13',
                955: '#090d18'
              }
            }
          }
        }
      };
    }
  } catch (e) {
    console.error("Tailwind configuration error:", e);
  }
</script>

<style>
  :root {
    --ss-color: #3b82f6;
    --mn-color: #f97316;
    --bg-dark: #0b0f19;
    --card-dark: rgba(17, 24, 39, 0.65);
    --text-muted: #94a3b8;
  }
  body {
    background-color: #0b0f19;
    color: #e2e8f0;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }
  .glass-card {
    background: rgba(17, 24, 39, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
  }
  .glass-card:hover {
    border-color: rgba(255, 255, 255, 0.16);
  }
  body.light-theme {
    background-color: #f8fafc !important;
    color: #0f172a !important;
  }
  body.light-theme .glass-card {
    background: rgba(255, 255, 255, 0.95) !important;
    border-color: rgba(15, 23, 42, 0.15) !important;
    color: #0f172a !important;
  }
  body.light-theme input, body.light-theme select, body.light-theme textarea {
    background-color: #ffffff !important;
    color: #0f172a !important;
    border-color: #cbd5e1 !important;
  }
  /* Custom scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
  }
  body.light-theme ::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.15);
  }
  .ambient-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    z-index: -10;
    pointer-events: none;
  }
  .glow-1 { top: -10%; right: -10%; width: 300px; height: 300px; background: #3b82f6; }
  .glow-2 { bottom: 10%; left: -20%; width: 400px; height: 400px; background: #a855f7; }
</style>
</head>

  <!-- EXPORT MODAL -->
  <div id="export-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card rounded-3xl w-full max-w-md p-6 space-y-4 relative">
      <div class="flex justify-between items-center pb-2 border-b border-white/5">
        <h3 class="font-outfit font-extrabold text-base text-slate-100">📊 Export Follow-up Data</h3>
        <button onclick="closeExportModal()" class="text-slate-400 hover:text-white font-bold text-sm">✕</button>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block text-[10px] text-slate-450 font-bold uppercase mb-2">1. Select Procedure</label>
          <select id="export-procedure-select" class="w-full bg-slate-900 border border-white/5 rounded-xl p-2.5 focus:outline-none">

              <span>Post-op Visits Timeline (Intraocular Pressure, Meds)</span>

        <button onclick="closeExportModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-330 font-bold text-xs">Cancel</button>
        <button onclick="triggerCsvExport()" class="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center justify-center gap-1.5">
          <span>📥 Download Excel (CSV)</span>

      </div>

  </div>

  <!-- MAIN APPLICATION JAVASCRIPT -->
  <script>
    // ── DATABASE CONSTANTS ────────────────────────────────
    const COL = 'gf_v6';
    const dbKey = id => `gf_db_${COL}_${id}`;

    // Starting default setup for Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDei4WwO7zZgnhcINOlyl_FLxKMr1U-uqY",
      authDomain: "glaucoma-fellowship.firebaseapp.com",
      projectId: "glaucoma-fellowship",
      storageBucket: "glaucoma-fellowship.firebasestorage.app",
      messagingSenderId: "687596886857",
      appId: "1:687596886857:web:1e124cf2aa382f05901898"
    };

    // Defaults for baseline characteristic options
    const DEF_DIAGS = ['POAG', 'PACG', 'NTG', 'PXG', 'Neovascular GLC', 'Uveitic GLC', 'Steroid GLC', 'OHT', 'GLC Suspect'];
    const DEF_LENS = ['Phakic', 'Pseudophakic', 'Aphakic'];

    // ── GLOBAL APPLICATION STATE ──────────────────────────
    let state = {
      settings: {
        targetIop: 15,
        customBaselineFields: [],
        customVisitFields: []
      },
      patients: []
    };

    // Read only reference from main portal logbook
    let orLog = [];
    // Read only reference from main portal settings
    let mainProcs = ['Trabeculectomy', 'Ahmed Valve', 'MIGS–iStent', 'MIGS–KDB Goniotomy', 'CPC', 'Bleb Revision', 'Needling+5FU', 'Phaco+Trab', 'SLT', 'YAG PI', 'ALT', '5-FU Injection', 'GATT', 'ECP'];

    // Session status
    let session = {
      currentFellow: null,      // 'SS' or 'MN'
      activeView: 'login',      // 'login', 'dashboard', 'profile', 'settings'
      selectedPatientId: null,
      searchQuery: '',
      filterProcedure: 'all',
      filterScope: 'my',        // 'my' or 'all'
      isEditingBaseline: false,
      sortBy: 'date',
      sortOrder: 'desc'
    };

    let db = null;
    let isOnlineDB = false;

    // Initialize Firebase
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true })
          .catch(err => console.warn("Firebase persistence warning:", err));
        isOnlineDB = true;
        console.log("Firebase initialized successfully.");
      }
    } catch (e) {
      console.warn("Firebase initialization failed, running locally.", e);
    }

    // ── POST-OP WEEKS CALCULATOR ──────────────────────────
    function getPostOpLabel(surgeryDateStr, visitDateStr) {
      const sDate = new Date(surgeryDateStr);
      const vDate = new Date(visitDateStr);
      sDate.setHours(0,0,0,0);
      vDate.setHours(0,0,0,0);
      
      const diffTime = vDate.getTime() - sDate.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return "Day 0 (Surgery)";
      if (diffDays < 0) return `${Math.abs(diffDays)}d Pre-op`;
      
      if (diffDays < 7) {
        return `Day ${diffDays}`;
      }
      
      const w = Math.floor(diffDays / 7);
      const r = diffDays % 7;
      let wkStr = `${w}Wk`;
      if (r > 0) wkStr += ` ${r}D`;
      
      return `Day ${diffDays} (${wkStr})`;
    }

    // ── DATA PERSISTENCE & SYNC ───────────────────────────
    function loadLocalCache() {
      try {
        const storedTracker = localStorage.getItem(dbKey('tracker'));
        if (storedTracker) {
          const parsed = JSON.parse(storedTracker);
          state.settings = parsed.settings || state.settings;
          state.patients = parsed.patients || [];
        }
        const storedLog = localStorage.getItem(dbKey('logbook'));
        if (storedLog) {
          orLog = JSON.parse(storedLog).entries || [];
        }
        const storedProcs = localStorage.getItem(dbKey('procsList'));
        if (storedProcs) {
          mainProcs = JSON.parse(storedProcs);
        }
      } catch (e) {
        console.warn("Local storage cache read failed:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(dbKey('tracker'), JSON.stringify(state));
      } catch (e) {
        console.warn("Local storage cache save failed:", e);
      }
      
      if (isOnlineDB) {
        db.collection(COL).doc('tracker').set(state).catch(err => {
          console.error("Firestore sync error:", err);
          updateSyncBadge(err.message);
        });
      }
    }

    function initSyncListeners() {
      loadLocalCache();
      
      // Auto routing if fellow session was saved
      const savedFellow = localStorage.getItem('gf_tracker_fellow');
      if (savedFellow) {
        session.currentFellow = savedFellow;
        session.activeView = 'dashboard';
      } else {
        session.activeView = 'login';
      }
      renderView();

      if (!isOnlineDB) {
        updateSyncBadge();
        return;
      }

      // Helper to merge entry lists by unique id or composite key
      function mergeTrackerEntries(remoteList, localList) {
        const map = new Map();
        (remoteList || []).forEach(item => {
          if (!item) return;
          const key = item.id || `${item.hn || item.HN}_${item.date}_${item.procedure}`;
          map.set(key, item);
        });
        let addedLocalCount = 0;
        (localList || []).forEach(item => {
          if (!item) return;
          const key = item.id || `${item.hn || item.HN}_${item.date}_${item.procedure}`;
          if (!map.has(key)) {
            map.set(key, item);
            addedLocalCount++;
          }
        });
        return { merged: Array.from(map.values()), addedLocalCount };
      }

      // 1. Tracker doc snapshot
      db.collection(COL).doc('tracker').onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          state.settings = data.settings || state.settings;
          const remotePatients = data.patients || [];
          const { merged, addedLocalCount } = mergeTrackerEntries(remotePatients, state.patients);
          state.patients = merged;
          localStorage.setItem(dbKey('tracker'), JSON.stringify(state));
          
          if (addedLocalCount > 0 && isOnlineDB) {
            saveState();
          }
        } else {
          // Init empty database record on Firestore
          saveState();
        }
        updateSyncBadge();
        // Check for new cases to auto-sync
        checkNewOrCases();
        renderView();
      }, err => {
        console.error("Sync error:", err);
        updateSyncBadge(err.message);
      });

      // 2. OR Logbook snapshot (Read-only dependency with smart merge)
      db.collection(COL).doc('logbook').onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          const remoteEntries = data.entries || [];
          const { merged } = mergeTrackerEntries(remoteEntries, orLog);
          orLog = merged;
          localStorage.setItem(dbKey('logbook'), JSON.stringify({ entries: orLog }));
          checkNewOrCases();
          renderView();
        }
      });

      // 3. Settings snapshot (Read-only dependency for SURGICAL PROCEDURES)
      db.collection(COL).doc('settings').onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          if (data && data.procs) {
            mainProcs = data.procs;
            localStorage.setItem(dbKey('procsList'), JSON.stringify(data.procs));
            renderView();
          }
        }
      });
    }

    // Auto-create patient from OR log if it doesn't exist
    function checkNewOrCases() {
      let updated = false;
      orLog.forEach(log => {
        // Must match a valid HN
        if (!log.HN || !log.date) return;
        
        const exists = state.patients.some(p => p.hn === log.HN && p.date === log.date);
        if (!exists) {
          // Log is created dynamically
          state.patients.push({
            id: 'p_' + log.HN + '_' + Date.now(),
            hn: log.HN,
            name: log.name || '',
            fellow: log.fellow || 'SS', // defaults
            procedure: log.procedure || 'Trabeculectomy',
            laterality: log.laterality || 'RE',
            date: log.date,
            supervisor: log.supervisor || '',
            baseline: {
              age: '',
              sex: '',
              diagnosis: log.diagnosis || '',
              lensStatus: '',
              prevSurgery: '',
              customValues: {}
            },
            visits: []
          });
          updated = true;
        }
      });
      if (updated) {
        saveState();
      }
    }

    // Force manual import of OR Log cases
    window.syncFromOrLog = function() {
      checkNewOrCases();
      alert("OR Cases synchronized successfully!");
      renderView();
    };

    function updateSyncBadge(errStr = '') {
      const container = document.getElementById('sync-badge-container');
      if (!container) return;
      if (!isOnlineDB) {
        container.innerHTML = `<span class="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-white/5 text-[10px] font-bold">Offline</span>`;
      } else if (errStr) {
        container.innerHTML = `<span class="px-2.5 py-0.5 rounded-full bg-rose-955/30 text-rose-450 border border-rose-900/30 text-[10px] font-bold" title="${errStr}">Sync Error</span>`;
      } else {
        container.innerHTML = `<span class="px-2.5 py-0.5 rounded-full bg-emerald-955/30 text-emerald-450 border border-emerald-900/30 text-[10px] font-bold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Synced</span>`;
      }
    }

    // ── THEME SUPPORT ─────────────────────────────────────
    window.toggleTheme = function() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('gf_theme', isLight ? 'light' : 'dark');
      updateThemeButton();
    };
    function updateThemeButton() {
      const btn = document.getElementById('theme-toggle-btn');
      if (!btn) return;
      const isLight = document.body.classList.contains('light-theme');
      btn.innerHTML = isLight ? '☀️' : '🌙';
    }

    // ── APP NAVIGATION ────────────────────────────────────
    window.routeTo = function(view, id = null) {
      session.activeView = view;
      if (id) session.selectedPatientId = id;
      if (view === 'dashboard') {
        session.isEditingBaseline = false;
      }
      renderView();
    };

    window.selectFellow = function(fellow) {
      session.currentFellow = fellow;
      localStorage.setItem('gf_tracker_fellow', fellow);
      session.activeView = 'dashboard';
      renderView();
    };

    window.logoutFellow = function() {
      session.currentFellow = null;
      localStorage.removeItem('gf_tracker_fellow');
      session.activeView = 'login';
      renderView();
    };

    // ── MAIN RENDER PIPELINE ──────────────────────────────
    function renderView() {
      const main = document.getElementById('main-content');
      const headerLabel = document.getElementById('header-fellow-label');
      const importBtn = document.getElementById('header-sync-btn-container');

      const myPatients = state.patients.filter(p => p.fellow === session.currentFellow);
      const activeList = session.filterScope === 'my' ? myPatients : state.patients;
      
      // Filter list further based on search query
      const query = session.searchQuery.toLowerCase().trim();
      const filteredPatients = activeList.filter(p => {
        const matchSearch = p.hn.includes(query) || 
                            (p.name || '').toLowerCase().includes(query) || 
                            (p.supervisor || '').toLowerCase().includes(query);
        const matchProc = session.filterProcedure === 'all' || p.procedure === session.filterProcedure;
        return matchSearch && matchProc;

      // Sort patients list based on header click
      filteredPatients.sort((a, b) => {
        let valA = '';
        let valB = '';

          valA = a.hn;
          valB = b.hn;
        } else if (session.sortBy === 'name') {
          valA = (a.name || '').toLowerCase();
          valB = (b.name || '').toLowerCase();
        } else if (session.sortBy === 'procedure') {
          valA = a.procedure;
          valB = b.procedure;
        } else if (session.sortBy === 'supervisor') {
          valA = a.supervisor;
          valB = b.supervisor;
        } else if (session.sortBy === 'date') {
          valA = new Date(a.date);
          valB = new Date(b.date);
        } else if (session.sortBy === 'iop') {
          valA = a.visits.length > 0 ? Number(a.visits[a.visits.length - 1].iop) : -1;
          valB = b.visits.length > 0 ? Number(b.visits[b.visits.length - 1].iop) : -1;
        } else if (session.sortBy === 'meds') {
          valA = a.visits.length > 0 ? Number(a.visits[a.visits.length - 1].medsCount) : -1;
          valB = b.visits.length > 0 ? Number(b.visits[b.visits.length - 1].medsCount) : -1;
        }

        if (valA < valB) return session.sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return session.sortOrder === 'asc' ? 1 : -1;
        return 0;

      // Calculate aggregated metrics
      const totalVisits = activeList.reduce((acc, p) => acc + p.visits.length, 0);

    // ── GRAPH PLOT ENGINE (SVG BASED) ─────────────────────
    function renderIopGraph(visits) {
      if (!visits || visits.length === 0) {
        return `<div class="p-6 text-center text-slate-500 italic text-[11px]">Log post-op visits to construct target tracking graphs.</div>`;
      }

      // Dimension settings
      const w = 550;
      const h = 200;
      const padding = 35;

      // Extract values
      const iops = visits.map(v => Number(v.iop) || 0);
      const meds = visits.map(v => Number(v.medsCount) || 0);
      const dates = visits.map(v => new Date(v.date));

      const minIop = 0;
      const maxIop = Math.max(25, ...iops) + 5;

      // Render coordinates mapping helpers
      const getX = (idx) => padding + (idx * (w - 2 * padding) / Math.max(1, visits.length - 1));
      const getY = (val) => h - padding - (val * (h - 2 * padding) / maxIop);

      // SVG path construction
      let pathD = '';
      let dots = '';
      visits.forEach((v, idx) => {
        const x = getX(idx);
        const y = getY(v.iop);
        
        if (idx === 0) pathD = `M ${x} ${y}`;
        else pathD += ` L ${x} ${y}`;

        // Dot nodes with conditional color values
        const dotColor = Number(v.iop) > state.settings.targetIop ? '#ef4444' : '#3b82f6';
        dots += `<circle cx="${x}" cy="${y}" r="4" fill="${dotColor}" stroke="#0b0f19" stroke-width="1.5" />`;
        // Label values above dots
        dots += `<text x="${x}" y="${y - 8}" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="bold">${v.iop}</text>`;
        
        // Date label below axis
        const labelStr = new Date(v.date).toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
        dots += `<text x="${x}" y="${h - 10}" text-anchor="middle" fill="#64748b" font-size="8">${labelStr}</text>`;
      });

      // Target IOP dotted line
      const targetY = getY(state.settings.targetIop);
      const targetLine = `<line x1="${padding}" y1="${targetY}" x2="${w - padding}" y2="${targetY}" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" />
                          <text x="${w - padding + 5}" y="${targetY + 3}" fill="#ef4444" font-size="8">Limit (${state.settings.targetIop})</text>`;

      // Horizontal reference axis lines
      let referenceGridLines = '';
      [10, 20, 30].forEach(val => {
        if (val < maxIop) {
          const rY = getY(val);
          referenceGridLines += `<line x1="${padding}" y1="${rY}" x2="${w - padding}" y2="${rY}" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
                                 <text x="${padding - 18}" y="${rY + 3}" fill="#475569" font-size="8">${val}</text>`;
        }
      });

      return `
        <svg width="100%" height="100%" viewBox="0 0 ${w + 40} ${h}" class="max-w-[550px] select-none">
          <!-- Grid References -->
          ${referenceGridLines}
          
          <!-- Target Limit Line -->
          ${targetLine}

          <!-- Axis Lines -->
          <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${h - padding}" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          <line x1="${padding}" y1="${h - padding}" x2="${w - padding}" y2="${h - padding}" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          
          <!-- IOP Line Graph Path -->
          <path d="${pathD}" fill="none" stroke="#3b82f6" stroke-width="2.5" />
          
          <!-- Node Dots & Labels -->
          ${dots}
        </svg>
      `;
    }

    // ── PATIENT BASLINE ACTIONS ───────────────────────────
    window.setEditBaseline = function(edit) {
      session.isEditingBaseline = edit;
      renderView();
    };

    window.saveBaselineDetails = function() {
      const p = state.patients.find(x => x.id === session.selectedPatientId);
      if (!p) return;

      p.name = document.getElementById('baseline-form-name').value.trim();
      p.baseline.diagnosis = document.getElementById('baseline-form-diag').value;
      p.baseline.age = document.getElementById('baseline-form-age').value;
      p.baseline.sex = document.getElementById('baseline-form-sex').value;
      p.baseline.lensStatus = document.getElementById('baseline-form-lens').value;
      p.baseline.prevSurgery = document.getElementById('baseline-form-prev').value.trim();

      // Custom fields compile
      p.baseline.customValues = p.baseline.customValues || {};
      state.settings.customBaselineFields.forEach(cf => {
        const input = document.getElementById(`baseline-form-${cf.id}`);
        if (input) {
          p.baseline.customValues[cf.id] = input.value.trim();
        }
      });

      saveState();
      session.isEditingBaseline = false;
      renderView();
    };

    window.deletePatient = function() {
      if (!confirm("Are you sure you want to permanently delete this patient record? All visits will be deleted.")) return;
      state.patients = state.patients.filter(x => x.id !== session.selectedPatientId);
      saveState();
      routeTo('dashboard');
    };

    // ── VISIT RECORD MODAL ACTIONS ────────────────────────
    let editingVisitId = null;

    window.openVisitModal = function(visitId = null) {
      const p = state.patients.find(x => x.id === session.selectedPatientId);
      if (!p) return;

      editingVisitId = visitId;
      const modal = document.getElementById('visit-modal');
      const title = document.getElementById('visit-modal-title');
      
      const dateEl = document.getElementById('visit-form-date');
      const iopEl = document.getElementById('visit-form-iop');
      const tonEl = document.getElementById('visit-form-tonometer');
      const medsEl = document.getElementById('visit-form-meds');
      const vaEl = document.getElementById('visit-form-va');
      const notesEl = document.getElementById('visit-form-notes');

      // Custom fields DOM injector
      const customContainer = document.getElementById('visit-custom-fields-container');
      customContainer.innerHTML = '';

      if (visitId) {
        // Edit Visit mode
        title.innerText = "📝 Edit Follow-up Visit";
        const v = p.visits.find(x => x.id === visitId);
        if (!v) return;

        dateEl.value = v.date;
        iopEl.value = v.iop;
        tonEl.value = v.tonometer || 'Goldmann';
        medsEl.value = v.medsCount;
        vaEl.value = v.va || '';
        notesEl.value = v.notes || '';

        state.settings.customVisitFields.forEach(cf => {
          const val = v.customValues?.[cf.id] || '';
          customContainer.innerHTML += `
            <div>
              <label class="block text-[10px] text-slate-455 font-bold uppercase mb-1">${cf.name}</label>
              <input type="text" id="visit-form-${cf.id}" value="${val}" class="w-full bg-slate-900 border border-white/5 rounded-xl p-2.5 focus:outline-none">
            </div>
          `;
        });
      } else {
        // Add new visit mode
        title.innerText = "＋ Log Follow-up Visit";
        
        // Auto default to today
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        iopEl.value = '';
        tonEl.value = 'Goldmann';
        medsEl.value = '';
        vaEl.value = '';
        notesEl.value = '';

        state.settings.customVisitFields.forEach(cf => {
          customContainer.innerHTML += `
            <div>
              <label class="block text-[10px] text-slate-455 font-bold uppercase mb-1">${cf.name}</label>
              <input type="text" id="visit-form-${cf.id}" class="w-full bg-slate-900 border border-white/5 rounded-xl p-2.5 focus:outline-none">
            </div>
          `;
        });
      }

      modal.classList.remove('hidden');
    };

    window.closeVisitModal = function() {
      document.getElementById('visit-modal').classList.add('hidden');
    };

    window.saveVisitCard = function() {
      const p = state.patients.find(x => x.id === session.selectedPatientId);
      if (!p) return;

      const date = document.getElementById('visit-form-date').value;
      const iop = Number(document.getElementById('visit-form-iop').value);
      const tonometer = document.getElementById('visit-form-tonometer').value;
      const medsCount = Number(document.getElementById('visit-form-meds').value || 0);
      const va = document.getElementById('visit-form-va').value.trim();
      const notes = document.getElementById('visit-form-notes').value.trim();

      if (!date || isNaN(iop)) {
        alert("Visit date and valid IOP are required.");
        return;
      }

      // Collect custom visit fields values
      const customValues = {};
      state.settings.customVisitFields.forEach(cf => {
        const input = document.getElementById(`visit-form-${cf.id}`);
        if (input) {
          customValues[cf.id] = input.value.trim();
        }
      });

      if (editingVisitId) {
        // Save existing visit
        p.visits = p.visits.map(v => {
          if (v.id === editingVisitId) {
            return {
              ...v, date, iop, tonometer, medsCount, va, notes, customValues,
              daysElapsed: Math.round((new Date(date) - new Date(p.date)) / (1000 * 60 * 60 * 24)),
              weeksLabel: getPostOpLabel(p.date, date)
            };
          }
          return v;
        });
      } else {
        // Append new visit
        p.visits.push({
          id: 'v_' + Date.now(),
          date,
          iop,
          tonometer,
          medsCount,
          va,
          notes,
          customValues,
          daysElapsed: Math.round((new Date(date) - new Date(p.date)) / (1000 * 60 * 60 * 24)),
          weeksLabel: getPostOpLabel(p.date, date)
        });
      }

      // Re-sort visits chronologically
      p.visits.sort((a, b) => new Date(a.date) - new Date(b.date));

      saveState();
      closeVisitModal();
      renderView();
    };

      }

          </div>

      }

            <button onclick="routeTo('dashboard')" class="text-xs font-bold text-blue-400 hover:underline">
              &larr; Back to Dashboard
            </button>
            <h3 class="font-outfit font-extrabold text-base text-slate-100">⚙️ Customized Application Settings</h3>
          </div>

          <!-- Target Threshold -->
          <div class="glass-card p-5 rounded-3xl space-y-3">

            <div class="flex items-center gap-4 text-xs">

                <label class="block text-[10px] text-slate-455 font-bold uppercase mb-1">Dotted Line Threshold (mmHg)</label>
                <input type="number" id="settings-target-iop" value="${state.settings.targetIop}" class="w-full bg-slate-900 border border-white/5 rounded-xl p-2.5 focus:outline-none">
              </div>
              <button onclick="saveTargetThreshold()" class="mt-5 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-white transition-all select-none">

              </button>
            </div>
          </div>

          <!-- Custom Baseline Fields -->
          <div class="glass-card p-5 rounded-3xl space-y-4">
            <div class="flex justify-between items-center border-b border-white/5 pb-2">
              <h4 class="font-bold text-slate-200 text-xs">Custom Baseline Characteristics</h4>
              <span class="text-[10px] text-slate-400">Added to pre-op diagnostic records</span>
            </div>
            
            <div class="space-y-2">
              ${baselineFieldsHtml}
            </div>

            <div class="pt-3 border-t border-white/5 space-y-3 text-xs">
              <h5 class="font-bold text-slate-350">＋ Add Custom Baseline Field</h5>
              <div class="grid grid-cols-2 gap-3">

          <!-- Custom Visit Fields -->

            <div class="flex justify-between items-center border-b border-white/5 pb-2">
              <h4 class="font-bold text-slate-200 text-xs">Custom Timeline Visit Characteristics</h4>
              <span class="text-[10px] text-slate-400">Added to daily post-op follow-up logs</span>
            </div>
            
            <div class="space-y-2">

              <h5 class="font-bold text-slate-355">＋ Add Custom Visit Field</h5>

    window.saveTargetThreshold = function() {
      const val = Number(document.getElementById('settings-target-iop').value || 15);
      state.settings.targetIop = val;
      saveState();
      alert("Threshold target saved successfully!");
      renderView();
    };

    window.addCustomField = function(scope) {
      const nameInput = document.getElementById(`add-${scope}-name`);
      const typeInput = document.getElementById(`add-${scope}-type`);
      
      const name = nameInput.value.trim();
      const type = typeInput.value;

      if (!name) {
        alert("Please enter a valid characteristic name.");
        return;
      }

      const newField = {
        id: 'cf_' + Date.now(),
        name,
        type
      };

      if (scope === 'baseline') {
        state.settings.customBaselineFields.push(newField);
      } else {
        state.settings.customVisitFields.push(newField);
      }

      saveState();
      nameInput.value = '';
      renderView();
    };

    window.removeCustomField = function(scope, fieldId) {
      if (!confirm("Are you sure you want to delete this field? All saved values under this key will be deleted from patient timelines.")) return;
      
      if (scope === 'baseline') {
        state.settings.customBaselineFields = state.settings.customBaselineFields.filter(f => f.id !== fieldId);
      } else {
        state.settings.customVisitFields = state.settings.customVisitFields.filter(f => f.id !== fieldId);
      }

      saveState();
      renderView();
    };

    window.openExportModal = function() {
      const select = document.getElementById('export-procedure-select');
      if (select) {
        select.innerHTML = `<option value="all">All Procedures (Combined)</option>` + 
          mainProcs.map(p => `<option value="${p}">${p}</option>`).join('');
      }
      document.getElementById('export-modal').classList.remove('hidden');
    };
    window.closeExportModal = function() {
      document.getElementById('export-modal').classList.add('hidden');
    };

    window.triggerCsvExport = function() {
      const proc = document.getElementById('export-procedure-select').value;
      const incBaseline = document.getElementById('export-col-baseline').checked;
      const incSurgery = document.getElementById('export-col-surgery').checked;
      const incVisits = document.getElementById('export-col-visits').checked;

      // Filter patients to export
      let list = state.patients;
      if (proc !== 'all') {
        list = list.filter(p => p.procedure === proc);
      }

      if (list.length === 0) {
        alert("No patient records matching selection to export.");
        return;
      }

      // Find max visits to create dynamic visit columns
      let maxVisits = 0;
      list.forEach(p => {
        if (p.visits.length > maxVisits) maxVisits = p.visits.length;
      });

      // Construct CSV Header
      let headers = ['Patient ID', 'HN', 'Surgeon Fellow'];
      
      if (incSurgery) {
        headers.push('Procedure', 'Laterality', 'Surgery Date', 'Supervisor');
      }
      if (incBaseline) {
        headers.push('Diagnosis', 'Age', 'Sex', 'Lens Status', 'Previous Surgeries');
        // Add custom baseline fields
        state.settings.customBaselineFields.forEach(cf => {
          headers.push(cf.name);
        });
      }
      if (incVisits) {
        for (let i = 1; i <= maxVisits; i++) {
          headers.push(`Visit ${i} Date`, `Visit ${i} Post-Op`, `Visit ${i} IOP`, `Visit ${i} Meds`, `Visit ${i} VA`, `Visit ${i} Notes`);
          state.settings.customVisitFields.forEach(cf => {
            headers.push(`Visit ${i} ${cf.name}`);
          });
        }
      }

      // Compile CSV rows
      const rows = [headers.map(h => `"${h.replace(/"/g, '""')}"`).join(',')];

      list.forEach(p => {
        let rowData = [p.id, p.hn, p.fellow];

        if (incSurgery) {
          rowData.push(p.procedure, p.laterality, p.date, p.supervisor);
        }
        if (incBaseline) {
          rowData.push(
            p.baseline.diagnosis || '',
            p.baseline.age || '',
            p.baseline.sex || '',
            p.baseline.lensStatus || '',
            p.baseline.prevSurgery || ''
          );
          state.settings.customBaselineFields.forEach(cf => {
            rowData.push(p.baseline.customValues?.[cf.id] || '');
          });
        }
        if (incVisits) {
          for (let i = 0; i < maxVisits; i++) {
            const v = p.visits[i];
            if (v) {
              const elapsedLabel = getPostOpLabel(p.date, v.date);
              rowData.push(v.date, elapsedLabel, v.iop, v.medsCount, v.va || '', v.notes || '');
              state.settings.customVisitFields.forEach(cf => {
                rowData.push(v.customValues?.[cf.id] || '');
              });
            } else {
              // Fill blanks
              rowData.push('', '', '', '', '', '');
              state.settings.customVisitFields.forEach(() => rowData.push(''));
            }
          }
        }

        const rowCsv = rowData.map(val => {
          const str = String(val === null || val === undefined ? '' : val);
          return `"${str.replace(/"/g, '""')}"`;
        }).join(',');

        rows.push(rowCsv);
      });

      // Download CSV file trigger
      const csvContent = "\uFEFF" + rows.join("\n"); // Include UTF-8 BOM for Excel Thai language support
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      
      const fileName = `Glaucoma_Tracker_${proc}_${Date.now()}.csv`;
      link.setAttribute("download", fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      closeExportModal();
    };

    // ── INITIALIZATION ────────────────────────────────────
    window.addEventListener('load', () => {
      // Load dark/light theme setting
      const savedTheme = localStorage.getItem('gf_theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      updateThemeButton();

      // Setup Firestore real-time bindings
      initSyncListeners();
    });
  </script>
