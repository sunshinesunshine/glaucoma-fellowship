    window.renderStudyCardsList = function(cardsList) {
      const grid = document.getElementById('study-cards-grid');
      if (!grid) return;

      if (cardsList.length === 0) {
        grid.innerHTML = `
          <div class="col-span-1 md:col-span-2 text-center text-slate-500 py-12 text-xs">
            🎴 No study notes found. Click "+ Add Study Note" to create one!
          </div>
        `;
        return;
      }

      grid.innerHTML = cardsList.map((c) => `
        <div class="glass-card rounded-3xl p-5 border border-white/5 space-y-3 bg-slate-950 flex flex-col justify-between">
          <div class="space-y-2">
            <div class="flex items-start justify-between">
              <span class="px-2 py-0.5 rounded-full text-[9px] font-extrabold uppercase bg-blue-900/30 text-blue-400 border border-blue-900/40">Clinical Note</span>
              <div class="flex gap-2">
                <button onclick="editStudyCard('${c.id}')" class="text-blue-455 hover:underline text-[10px] font-bold">Edit</button>
                <button onclick="deleteStudyCard('${c.id}')" class="text-rose-455 hover:underline text-[10px] font-bold">Delete</button>
              </div>
            </div>
            <h3 class="font-outfit font-extrabold text-sm text-slate-200">${c.title || 'Untitled'}</h3>
            
            <div class="space-y-1">
              <div class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Clinical Presentation:</div>
              <p class="text-xs text-slate-300 leading-relaxed">${c.presentation || '—'}</p>
            </div>

            <div class="space-y-1 pt-1">
              <div class="text-[9px] uppercase font-bold text-emerald-400 tracking-wider">Diagnosis:</div>
              <p class="text-xs text-emerald-300 font-semibold">${c.diagnosis || '—'}</p>
            </div>

            ${c.explanation ? `
              <div class="space-y-1 pt-1">
                <div class="text-[9px] uppercase font-bold text-blue-400 tracking-wider">Explanations & Clinical Pearls:</div>
                <p class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${c.explanation}</p>
              </div>
            ` : ''}
            
            ${c.image ? `
              <div class="w-full h-32 rounded-xl overflow-hidden bg-slate-900/80 mt-2 border border-white/5">
                <img src="${c.image}" class="w-full h-full object-cover"/>
              </div>
            ` : ''}
          </div>
          <div class="text-[9px] text-slate-500 font-bold uppercase tracking-wider pt-2 border-t border-white/5 mt-3">
            🎴 Study note
          </div>
        </div>
      `).join('');
    };

    window.filterStudyCards = function(q) {
      const query = q.toLowerCase().trim();
      if (!query) {
        renderStudyCardsList(state.study);
        return;
      }
      const filtered = state.study.filter(c =>
        (c.title || '').toLowerCase().includes(query) ||
        (c.presentation || '').toLowerCase().includes(query) ||
        (c.diagnosis || '').toLowerCase().includes(query) ||
        (c.explanation || '').toLowerCase().includes(query)
      );
      renderStudyCardsList(filtered);
    };

    window.renderAcademicList = function() {
      const tbody = document.getElementById('academic-list-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      const list = state.academicLog || [];
      const q = (session.academicSearch || '').toLowerCase().trim();
      
      const filtered = list.filter(e => {
        if (!q) return true;
        return (e.type || '').toLowerCase().includes(q) || 
               (e.topic || '').toLowerCase().includes(q) || 
               (e.supervisor || '').toLowerCase().includes(q) || 
               (e.notes || '').toLowerCase().includes(q);
      });
      
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 font-medium">No presentation logs found.</td></tr>`;
        return;
      }
      
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      filtered.forEach(e => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-900/30 transition-all font-medium';
        
        const dateObj = new Date(e.date + 'T12:00:00');
        const formattedDate = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        
        tr.innerHTML = `
          <td class="p-3 text-slate-355 whitespace-nowrap">${formattedDate}</td>
          <td class="p-3 text-slate-200">
            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${e.type === 'Journal Club' ? 'bg-indigo-900/40 text-indigo-300' : 'bg-pink-900/40 text-pink-300'}">${e.type}</span>
          </td>
          <td class="p-3 text-slate-200 truncate max-w-[250px]"><b>${e.topic || '—'}</b>${e.notes ? `<span class="text-[10px] text-slate-400 block font-normal italic truncate">${e.notes}</span>` : ''}</td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${e.fellow === 'SS' ? 'bg-blue-900/40 text-blue-300' : 'bg-orange-900/40 text-orange-300'}">${e.fellow}</span>
          </td>
          <td class="p-3 text-slate-300">${e.supervisor || '—'}</td>
          <td class="p-3 text-right whitespace-nowrap">
            <button onclick="editAcademic('${e.id}')" class="text-blue-455 hover:underline mr-2 font-bold text-[10px]">Edit</button>
            <button onclick="deleteAcademic('${e.id}')" class="text-rose-455 hover:underline font-bold text-[10px]">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    };

    window.filterAcademicLogs = function(q) {
      session.academicSearch = q;
      renderAcademicList();
    };

    // ── FLASHCARD EDIT MODALS & HELPERS ──────────────────
    let editingCardId = null;

    window.openStudyCardModal = function() {
      editingCardId = null;
      document.getElementById('study-modal-title').innerText = "＋ Add Flashcard Note";
      document.getElementById('study-form-title').value = "";
      document.getElementById('study-form-presentation').value = "";
      document.getElementById('study-form-diagnosis').value = "";
      document.getElementById('study-form-explanation').value = "";
      // Image upload removed — no file input to reset
      document.getElementById('study-card-modal').classList.remove('hidden');
    };

    window.closeStudyCardModal = function() {
      document.getElementById('study-card-modal').classList.add('hidden');
    };

    window.editStudyCard = function(id) {
      const c = state.study.find(e => e.id === id);
      if (!c) return;
      editingCardId = id;
      document.getElementById('study-modal-title').innerText = "📝 Edit Flashcard Note";
      document.getElementById('study-form-title').value = c.title || "";
      document.getElementById('study-form-presentation').value = c.presentation || "";
      document.getElementById('study-form-diagnosis').value = c.diagnosis || "";
      document.getElementById('study-form-explanation').value = c.explanation || "";
      // Image upload removed — existing images preserved in state but not shown
      document.getElementById('study-card-modal').classList.remove('hidden');
    };

    window.deleteStudyCard = function(id) {
      if (!confirm("Are you sure you want to delete this study note flashcard?")) return;
      state.study = state.study.filter(e => e.id !== id);
      saveState();
      renderActiveTab();
    };

    // Resizer helper to fit images within Firestore document sizes
    function resizeAndCompressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          const maxW = 500;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // compress as jpeg
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.saveStudyCard = function() {
      const title = document.getElementById('study-form-title').value.trim();
      const presentation = document.getElementById('study-form-presentation').value.trim();
      const diagnosis = document.getElementById('study-form-diagnosis').value.trim();
      const explanation = document.getElementById('study-form-explanation').value.trim();
      
      if (!title || !diagnosis) {
        alert("Title and Diagnosis are required fields.");
        return;
      }

      // Image upload removed — preserve existing image on edit, blank on new
      if (editingCardId) {
        state.study = state.study.map(e => {
          if (e.id === editingCardId) {
            return { ...e, title, presentation, diagnosis, explanation };
          }
          return e;
        });
      } else {
        state.study.push({
          id: 's_' + Date.now(),
          title,
          presentation,
          diagnosis,
          explanation,
          image: ""
        });
      }
      saveState();
      closeStudyCardModal();
      renderActiveTab();
    };

    // ── DATE FORMATTER ────────────────────────────────────
    function dateThaiString(d) {
      return d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function mkCalDays(mi) {
      const { y, m } = MONTHS[mi]; 
      const f = new Date(y, m, 1), d = [];
      const lead = f.getDay() === 0 ? 6 : f.getDay() - 1;
      for (let i = 0; i < lead; i++) d.push(null);
      for (let n = 1; n <= new Date(y, m + 1, 0).getDate(); n++) d.push(new Date(y, m, n));
      return d;
    }

    // ── APP STARTUP ───────────────────────────────────────
    window.addEventListener('load', async () => {
      try {
        // Check for share link hash
        const hash = location.hash;
        if (hash.startsWith('#share=')) {
          const token = hash.slice(7);
          // Show loading spinner while fetching share data
          document.body.innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0f1e;color:#cbd5e1;font-family:sans-serif;flex-direction:column;gap:16px">
              <div style="font-size:40px">🏥</div>
              <div style="font-size:14px;opacity:0.7">Loading schedule…</div>
            </div>`;
          try {
            if (!db) throw new Error('Firestore not available');
            const sharesDoc = await db.collection(COL).doc('shares').get();
            if (!sharesDoc.exists) throw new Error('No shares found');
            const data = sharesDoc.data()[token];
            if (!data) throw new Error('Share token not found or expired');
            renderReadOnlyView(data);
            const savedTheme = localStorage.getItem('gf_theme');
            if (savedTheme === 'light') document.body.classList.add('light-theme');
            return; // skip normal app init
          } catch (e) {
            console.error('Share link error:', e);
            document.body.innerHTML = `
              <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0f1e;color:#f87171;font-family:sans-serif;flex-direction:column;gap:12px;text-align:center;padding:24px">
                <div style="font-size:40px">⚠️</div>
                <div style="font-size:16px;font-weight:bold">Share link is invalid or expired</div>
                <div style="font-size:13px;opacity:0.6">${e.message}</div>
                <a href="./" style="color:#60a5fa;font-size:13px;margin-top:8px">← Open App</a>
              </div>`;
            return;
          }
        }

        // Initialize Firestore online sync, then switch tab
        initOnlineSync(() => {
          updateConnectionBadge();
          switchTab('summary');
          updateNavLockBadges();
        });
        
        // Theme support
        function updateThemeButton() {
          const btn = document.getElementById('theme-toggle-btn');
          if (!btn) return;
          const isLight = document.body.classList.contains('light-theme');
          btn.innerHTML = isLight ? '☀️' : '🌙';
        }
        window.updateThemeButton = updateThemeButton;

        window.toggleTheme = function() {
          const isLight = document.body.classList.toggle('light-theme');
          localStorage.setItem('gf_theme', isLight ? 'light' : 'dark');
          updateThemeButton();
        };
        
        // Load theme
        const savedTheme = localStorage.getItem('gf_theme');
        if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }
        updateThemeButton();
      } catch(err) {
        // Show error visibly on screen for debugging
        const main = document.getElementById('main-content');
        if (main) {
          main.innerHTML = `
            <div style="background:#1e1b4b;border:2px solid #ef4444;border-radius:12px;padding:20px;margin:20px;color:#fca5a5;font-family:monospace;">
              <strong style="color:#f87171;font-size:16px;">⚠️ App Startup Error</strong><br><br>
              <strong>Error:</strong> ${err.message}<br>
              <strong>Stack:</strong><br><pre style="white-space:pre-wrap;font-size:11px;color:#fcd34d">${err.stack}</pre>
            </div>
          `;
        }
        console.error('App startup error:', err);
      }
    });  </script>
