  .flip-card-front, .flip-card-back {
    backface-visibility: hidden;

    top: 0;
    left: 0;

    // Unicode-safe Base64 Helpers (supports Thai and non-Latin characters)
    function safeBtoa(str) {

    function safeAtob(str) {

    // ── HELPERS ───────────────────────────────────────────

    function resolveCell(mr, fel, y, m, date) {

      const defAct = getDefaultActivityName();

    function genICS(evts) {

        L.push(e.allDay ? `DTSTART;VALUE=DATE:${e.s}` : `DTSTART:${e.s}`);
        L.push(e.allDay ? `DTEND;VALUE=DATE:${e.e}` : `DTEND:${e.e}`);
        L.push(`SUMMARY:${e.title}`);
        L.push(`DESCRIPTION:${e.desc || ''}`);
        L.push('END:VEVENT');
      });
      L.push('END:VCALENDAR');
      return L.join('\r\n');
    }

    // ── DATABASE STATE MANAGEMENT ─────────────────────────

    let state = {

    function migrateAMPMTemplates() {

    function loadState() {

        const r = localStorage.getItem(dbKey('schedule'));

          state.mr = d.mr || initMR();

    // Smart Merge Helper: merges remote and local entry arrays by unique ID (or fallback composite key)
    function mergeEntries(remoteList, localList) {
      const map = new Map();
      (remoteList || []).forEach(item => {
        if (!item) return;
        const key = item.id || `${item.HN || item.hn}_${item.date}_${item.procedure}`;
        map.set(key, item);
      });
      let addedLocalCount = 0;
      (localList || []).forEach(item => {
        if (!item) return;
        const key = item.id || `${item.HN || item.hn}_${item.date}_${item.procedure}`;
        if (!map.has(key)) {
          map.set(key, item);
          addedLocalCount++;
        }
      });
      return { merged: Array.from(map.values()), addedLocalCount };
    }

    // ── BACKUP ENGINE ──────────────────────────────────────────────────────
    // Layer 1: Versioned LocalStorage Snapshots (14 daily, device-local)
    function writeVersionedBackup() {
      try {
        const now = new Date();
        const ts = now.toISOString().slice(0, 16).replace('T', '_').replace(':', '');  // "2026-08-15_1500"
        const snap = {
          timestamp: now.toISOString(),
          version: 'v6',
          orLog:    state.orLog    || [],
          preop:    state.preop    || [],
          academic: state.academicLog || [],
          study:    state.study    || []
        };
        localStorage.setItem(snapKey(ts), JSON.stringify(snap));

        // Prune: keep only the most recent MAX_LOCAL_SNAPS
        const allSnapKeys = Object.keys(localStorage)
          .filter(k => k.startsWith(SNAP_PREFIX))
          .sort();
        allSnapKeys.slice(0, Math.max(0, allSnapKeys.length - MAX_LOCAL_SNAPS))
          .forEach(k => localStorage.removeItem(k));
      } catch(e) {
        console.warn('[Backup] Local snapshot write failed:', e);
      }
    }

    // Layer 2: Daily Firestore Cloud Backup to gf_v6_backups/{YYYY-MM-DD}
    async function writeCloudBackup(force = false) {
      if (!isOnlineDB || !db) return;
      const today = new Date().toISOString().slice(0, 10);
      if (!force && lastCloudBackupDate === today) return; // Already backed up today
      try {
        await db.collection(COL_BACKUPS).doc(today).set({
          timestamp: new Date().toISOString(),
          version:   'v6',
          orLog:     state.orLog    || [],
          preop:     state.preop    || [],
          academic:  state.academicLog || [],
          study:     state.study    || []
        });
        lastCloudBackupDate = today;
        console.log('[Backup] Cloud snapshot written for', today);
      } catch(e) {
        console.warn('[Backup] Cloud snapshot write failed:', e);
      }
    }

    // List all local snapshots (newest first)
    function listLocalSnapshots() {
      return Object.keys(localStorage)
        .filter(k => k.startsWith(SNAP_PREFIX))
        .sort()
        .reverse()
        .map(k => {
          try {
            const snap = JSON.parse(localStorage.getItem(k));
            return {
              key: k,
              source: 'local',
              timestamp: snap.timestamp,
              orLogCount: (snap.orLog || []).length,
              preopCount: (snap.preop || []).length,
              snap
            };
          } catch(e) { return null; }
        })
        .filter(Boolean);
    }

    // List cloud snapshots from Firestore
    async function listCloudSnapshots() {
      if (!isOnlineDB || !db) return [];
      try {
        const snap = await db.collection(COL_BACKUPS)
          .orderBy(firebase.firestore.FieldPath.documentId(), 'desc')
          .limit(14)
          .get();
        return snap.docs.map(doc => ({
          key: doc.id,
          source: 'cloud',
          timestamp: doc.data().timestamp || doc.id,
          orLogCount: (doc.data().orLog || []).length,
          preopCount: (doc.data().preop || []).length,
          snap: doc.data()
        }));
      } catch(e) {
        console.warn('[Backup] Cloud list failed:', e);
        return [];
      }
    }

    // Restore from a snapshot (merge into current state)
    function restoreFromSnapshot(snap, mode = 'merge') {
      if (!snap) return;
      if (mode === 'merge') {
        const { merged: mergedLog } = mergeEntries(snap.orLog || [], state.orLog);
        const { merged: mergedPreop } = mergeEntries(snap.preop || [], state.preop);
        const { merged: mergedAcademic } = mergeEntries(snap.academic || [], state.academicLog);
        state.orLog = mergedLog;
        state.preop = mergedPreop;
        state.academicLog = mergedAcademic;
      } else {
        // Full overwrite (only if user explicitly chose it)
        state.orLog = snap.orLog || [];
        state.preop = snap.preop || [];
        state.academicLog = snap.academic || [];
      }
      saveState();
    }

    // ── END BACKUP ENGINE ───────────────────────────────────────────────────

    function initOnlineSync(callback) {
      // 1. Load local storage cache FIRST so state is populated before any async work
      loadState();

      // 2. Render immediately with cached data — do not wait for Firestore
      if (callback) callback();

      if (!isOnlineDB) return;

      // 3. Set up Firestore real-time listeners — each update re-renders the active tab
      const docs = ['settings', 'schedule', 'oncall', 'logbook', 'preop', 'study'];
      let loadedDocs = 0;
      const totalDocs = docs.length;
      let initialLoadDone = false;

      // Timeout fallback: if Firestore doesn't respond in 10s, mark as done
      const fallbackTimer = setTimeout(() => {
        if (!initialLoadDone) {
          initialLoadDone = true;
          updateNavLockBadges();
          updateConnectionBadge('Firestore timeout — running from cache');
        }
      }, 10000);

      docs.forEach(docId => {
        db.collection(COL).doc(docId).onSnapshot(snap => {
          try {
            if (snap.exists) {
              const data = snap.data();

              if (docId === 'settings') {
                if (data && Object.keys(data).length > 0) {
                  state.sett = { ...DEF_SETT, ...data };
                } else if (!initialLoadDone) {
                  writeDocToFirestore(docId);
                }
              } else if (docId === 'schedule') {
                const fsHasData = data.mr && Object.values(data.mr).some(v => v && (v.amTemplate !== 'none' || v.pmTemplate !== 'none'));
                const localHasData = state.mr && Object.values(state.mr).some(v => v && (v.amTemplate !== 'none' || v.pmTemplate !== 'none'));
                if (!fsHasData && localHasData && !initialLoadDone) {
                  writeDocToFirestore(docId);
                } else if (fsHasData) {
                  state.rotPats = data.rotPats || { A: emptyTpl(), B: emptyTpl(), C: emptyTpl() };
                  state.mr = data.mr || initMR();
                  migrateAMPMTemplates();
                }
              } else if (docId === 'oncall') {
                const fsHasData = data.call && Object.keys(data.call).length > 0;
                const localHasData = state.call && Object.keys(state.call).length > 0;
                if (!fsHasData && localHasData && !initialLoadDone) {
                  writeDocToFirestore(docId);
                } else {
                  state.call = { ...(data.call || {}), ...(state.call || {}) };
                  state.offDuty = { ...(data.offDuty || {}), ...(state.offDuty || {}) };
                }
              } else if (docId === 'logbook') {
                const remoteEntries = data.entries || [];
                const remoteAcademic = data.academic || [];
                const { merged: mergedLog, addedLocalCount: addedLog } = mergeEntries(remoteEntries, state.orLog);
                const { merged: mergedAcad, addedLocalCount: addedAcad } = mergeEntries(remoteAcademic, state.academicLog);
                
                state.orLog = mergedLog;
                state.academicLog = mergedAcad;
                
                // If local device had entries not present in remote, sync merged dataset back to Firestore
                if ((addedLog > 0 || addedAcad > 0) && isOnlineDB) {
                  writeDocToFirestore(docId);
                }
              } else if (docId === 'preop') {
                const remotePreop = data.entries || [];
                const { merged: mergedPreop, addedLocalCount } = mergeEntries(remotePreop, state.preop);
                state.preop = mergedPreop;
                
                if (addedLocalCount > 0 && isOnlineDB) {
                  writeDocToFirestore(docId);
                }
              } else if (docId === 'study') {
                const remoteCards = data.cards || [];
                const { merged: mergedStudy, addedLocalCount } = mergeEntries(remoteCards, state.study);
                state.study = mergedStudy;
                
                if (addedLocalCount > 0 && isOnlineDB) {
                  writeDocToFirestore(docId);
                }
              }
            } else {
              // Doc doesn't exist yet — write local data up to Firestore
              if (!initialLoadDone) writeDocToFirestore(docId);
            }
          } catch(e) {
            console.error("Snapshot error on " + docId + ":", e);
          } finally {
            updateConnectionBadge();
            loadedDocs++;
            if (!initialLoadDone && loadedDocs >= totalDocs) {
              initialLoadDone = true;
              clearTimeout(fallbackTimer);
              updateNavLockBadges();
              // Persist merged state to localStorage
              try {
                localStorage.setItem(dbKey('settings'), JSON.stringify(state.sett));
                localStorage.setItem(dbKey('schedule'), JSON.stringify({ rotPats: state.rotPats, mr: state.mr }));
                localStorage.setItem(dbKey('oncall'), JSON.stringify({ call: state.call, offDuty: state.offDuty }));
                localStorage.setItem(dbKey('logbook'), JSON.stringify({ entries: state.orLog, academic: state.academicLog || [] }));
                localStorage.setItem(dbKey('preop'), JSON.stringify({ entries: state.preop }));
                localStorage.setItem(dbKey('study'), JSON.stringify({ cards: state.study || [] }));
              } catch(e) {}
              // 🛡️ BACKUP: Take immediate snapshot after first successful sync
              writeVersionedBackup();
              writeCloudBackup(true); // force = true: always backup on first load
            }
            // Always re-render to show latest merged data
            renderActiveTab();
          }
        }, err => {
          console.error('Sync error on ' + docId + ':', err);
          updateConnectionBadge(err.message);
          loadedDocs++;
          if (!initialLoadDone && loadedDocs >= totalDocs) {
            initialLoadDone = true;
            clearTimeout(fallbackTimer);
            renderActiveTab();
          }
        });
      });
    }

    function writeDocToFirestore(docId) {
      if (!isOnlineDB) return;
      
      let data = {};
      if (docId === 'settings') {
        data = state.sett;
      } else if (docId === 'schedule') {
        data = { rotPats: state.rotPats, mr: state.mr };
      } else if (docId === 'oncall') {
        data = { call: state.call, offDuty: state.offDuty };
      } else if (docId === 'logbook') {
        data = { entries: state.orLog, academic: state.academicLog || [] };
      } else if (docId === 'preop') {
        data = { entries: state.preop };
      } else if (docId === 'study') {
        data = { cards: state.study || [] };
      }
      
      db.collection(COL).doc(docId).set(data).catch(err => {
        console.error(`Firestore write error on ${docId}:`, err);
        updateConnectionBadge(err.message);
      });
    }

    // Debounce timer for backup (avoid writing snapshot on every keystroke)
    let _backupDebounceTimer = null;
    function saveState() {
      // Local Storage Cache
      try {
        localStorage.setItem(dbKey('settings'), JSON.stringify(state.sett));
        localStorage.setItem(dbKey('schedule'), JSON.stringify({ rotPats: state.rotPats, mr: state.mr }));
        localStorage.setItem(dbKey('oncall'), JSON.stringify({ call: state.call, offDuty: state.offDuty }));
        localStorage.setItem(dbKey('logbook'), JSON.stringify({ entries: state.orLog, academic: state.academicLog || [] }));
        localStorage.setItem(dbKey('preop'), JSON.stringify({ entries: state.preop }));
        localStorage.setItem(dbKey('study'), JSON.stringify({ cards: state.study || [] }));
      } catch (e) {
        console.warn("Local storage cache write failed:", e);
      }
      
      // Firestore Sync
      if (isOnlineDB) {
        writeDocToFirestore('settings');
        writeDocToFirestore('schedule');
        writeDocToFirestore('oncall');
        writeDocToFirestore('logbook');
        writeDocToFirestore('preop');
        writeDocToFirestore('study');
      }

      // ── BACKUP LAYERS ─────────────────────────────────────
      // Layer 1: Write versioned local snapshot (debounced 2s to avoid spam)
      clearTimeout(_backupDebounceTimer);
      _backupDebounceTimer = setTimeout(() => {
        writeVersionedBackup();
        // Layer 2: Write cloud backup (once per day, non-blocking)
        writeCloudBackup();
      }, 2000);
      // ── END BACKUP ────────────────────────────────────────
      
      updateNavLockBadges();
    }

    function updateConnectionBadge(errMessage = '') {
      const container = document.getElementById('sync-badge-container');

      if (!isOnlineDB) {
        container.innerHTML = `
          <div class="bg-rose-955/20 px-3.5 py-1 rounded-full border border-rose-900/30">
            <span class="flex items-center gap-1.5 text-xs text-rose-400 font-semibold">
              <span class="w-2.5 h-2.5 bg-rose-500 rounded-full"></span>Offline Mode
            </span>
          </div>
        `;
      } else if (errMessage) {

    // ── APP ROUTER ────────────────────────────────────────
    function switchTab(tabId) {
      const hasPassword = !!(state.sett.appPassword || '');
      const isLockedTab = LOCKED_TABS.includes(tabId);
      
      if (isLockedTab && hasPassword && !session.unlocked) {
        session.pendingLockTab = tabId;
        openPasswordGate();
        return;
      }
      
      session.activeTab = tabId;
      
      // Update Tab Navigation classes
      document.querySelectorAll('nav button').forEach(btn => {
        const ind = btn.querySelector('.nav-indicator');
        const labels = btn.querySelectorAll('span');
        if (!ind || labels.length < 2) return;
        
        if (btn.id === `nav-btn-${tabId}`) {
          ind.classList.remove('hidden');
          btn.classList.add('bg-white/10', 'rounded-2xl', 'scale-105');
          labels[0].classList.add('scale-110', 'text-amber-400', 'drop-shadow-[0_0_10px_rgba(249,115,22,0.4)]');
          labels[0].classList.remove('opacity-65', 'text-slate-400');
          labels[1].classList.add('text-amber-400', 'font-extrabold');
          labels[1].classList.remove('text-slate-400');
        } else {
          ind.classList.add('hidden');
          btn.classList.remove('bg-white/10', 'rounded-2xl', 'scale-105');
          labels[0].classList.remove('scale-110', 'text-amber-400', 'drop-shadow-[0_0_10px_rgba(249,115,22,0.4)]');
          labels[0].classList.add('opacity-65', 'text-slate-400');
          labels[1].classList.remove('text-amber-400', 'font-extrabold');
          labels[1].classList.add('text-slate-400');
        }
      });
      
      renderActiveTab();
    }

    function openPasswordGate() {
      document.getElementById('gate-passcode-input').value = '';
      document.getElementById('gate-error-message').classList.add('hidden');
      document.getElementById('password-gate-screen').classList.remove('hidden');
      document.getElementById('gate-passcode-input').focus();
    }
    
    function cancelPasswordGate() {
      document.getElementById('password-gate-screen').classList.add('hidden');
      session.pendingLockTab = null;
    }

    // Handles administrative unlock
    function submitPasswordGate() {
      const pw = document.getElementById('gate-passcode-input').value;
      if (pw === state.sett.appPassword) {
        session.unlocked = true;
        document.getElementById('password-gate-screen').classList.add('hidden');
        if (session.pendingLockTab) {
          switchTab(session.pendingLockTab);
          session.pendingLockTab = null;
        } else {
          renderActiveTab();
        }
      } else {
        document.getElementById('gate-error-message').classList.remove('hidden');
      }
    }

    function updateNavLockBadges() {
      const hasPassword = !!(state.sett.appPassword || '');
      const showLock = hasPassword && !session.unlocked;
      LOCKED_TABS.forEach(tId => {
        const btn = document.getElementById(`nav-btn-${tId}`);
        if (btn) {
          const lock = btn.querySelector('.lock-indicator');
          if (showLock) lock.classList.remove('hidden');
          else lock.classList.add('hidden');
        }
      });
    }

    function renderActiveTab() {
      const main = document.getElementById('main-content');
      main.innerHTML = ''; // Clear previous contents

        switch (session.activeTab) {
          case 'summary':   renderSummary(main);  break;
          case 'rotation':  renderRotation(main); break;
          case 'oncall':    renderOnCall(main);   break;
          case 'cases':     renderCases(main);    break;
          case 'study':     renderStudy(main);    break;
          case 'settings':  renderSettings(main); break;
        }
      } catch(err) {
        main.innerHTML = `

            <div class="bg-slate-900/50 rounded-xl p-3 border border-white/5 text-left text-[11px] font-mono text-rose-350/90 overflow-x-auto">
              ${err.message}

              🔄 Retry Load
            </button>
          </div>
        `;
        console.error('Tab render error:', err);
      }
    }

    function getCompactActivityLabel(cell) {
      if (!cell) return '';
      const am = cell.am?.act || '';
      const pm = cell.pm?.act || '';
      if (!am && !pm) return '';
      if (am === pm) return am;
      return `${am}/${pm}`;
    }

    function getDetailedActivityLabel(cell) {
      if (!cell) return 'OPD';
      const amAct = cell.am?.act || 'OPD';
      const amSup = cell.am?.sup || '';
      const pmAct = cell.pm?.act || 'OPD';
      const pmSup = cell.pm?.sup || '';
      
      const amStr = `${amAct}${amSup ? `(${amSup})` : ''}`;
      const pmStr = `${pmAct}${pmSup ? `(${pmSup})` : ''}`;
      
      if (amAct === pmAct && amSup === pmSup) {
        return amStr;

      return `AM:${amStr} PM:${pmStr}`;

    async function sendTodayLINE(fel) {
      const msgEl = document.getElementById('line-notify-msg');
      const { lineWorkerUrl, ssLineId, mnLineId, morningActSched } = state.sett;
      const userId = fel === 'SS' ? ssLineId : mnLineId;
      if (!lineWorkerUrl || !userId) { if(msgEl) msgEl.textContent = '⚠️ Set Worker URL & User IDs in ⚙️ Settings'; return; }
      const t = new Date(), dow = t.getDay();
      const y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
      const isWeekend = dow < 1 || dow > 5;
      const isHoliday = isHol(y, m, d);
      const cell = resolveCell(state.mr, fel, y, m, t);
      const am = cell?.am || { act: '—', sup: '' };
      const pm = cell?.pm || { act: '—', sup: '' };
      // morningActSched index: 0=Mon…4=Fri; weekends default to '—'
      const mas = (morningActSched || [])[(dow >= 1 && dow <= 5) ? dow - 1 : 0] || '—';
      const dk = dStr(t);
      const duty = state.call[dk]; const off = getOffDutyFellow(dk);
      const isOff = off === fel;
      const isOC = duty === fel || duty?.fellow === fel;
      let scheduleBlock;
      if (isWeekend || isHoliday) {
        const label = isHoliday ? `🏖️ วันหยุดราชการ` : `📴 Weekend`;
        scheduleBlock = label;
      } else if (isOff) {
        scheduleBlock = `📴 OFF DUTY\n   ${getOffDutyReason(dk)||'—'}`;
      } else {
        scheduleBlock = `⏰ 07:00  Ward Round\n⏰ 08:00  ${mas}\n⏰ 09:00  ${am.act}${am.sup?` (${am.sup})`:''}\n⏰ 13:00  ${pm.act}${pm.sup?` (${pm.sup})`:''}`;
      }
      const msg = `🏥 Glaucoma Fellowship\n👨‍⚕️ Fellow ${fel}\n📅 ${t.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}\n──────────────\n${scheduleBlock}\n──────────────\n${isOC ? '🌙 ON CALL tonight' : '✅ No night duty'}`;
      if(msgEl) msgEl.textContent = 'Sending…';
      try {
        const r = await fetch(lineWorkerUrl + '/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userId, message: msg }) });
        if(msgEl) msgEl.textContent = r.ok ? '✅ Sent!' : `❌ Failed (${r.status})`;
      } catch(e) {
        if(msgEl) msgEl.textContent = '❌ Network error';
      }
      setTimeout(() => { if(msgEl) msgEl.textContent = ''; }, 5000);
    }

      const activeFel = session.activeRotFellow;

      let html = `<div class="space-y-2 text-xs">`;
      const sups = state.sett.sups || [];
      for (let occ = 1; occ <= 5; occ++) {
        const ov = wo?.[occ] || { act: 'OPD', sup: '' };
        const showSup = isClinicalActivity(ov.act);
        
        html += `
          <div class="flex items-center gap-2">

    function handleEditFieldUpdate(pathStr, occ, key, val) {
      const parts = pathStr.split('-');
      if (parts[0] === 'tmpl') {
        const tmpl = parts[1], slot = parts[2], di = Number(parts[3]);
        if (!state.rotPats[tmpl][slot][di].wo) state.rotPats[tmpl][slot][di] = emptyCell();
        state.rotPats[tmpl][slot][di].wo[occ][key] = val;
        
        if (key === 'act') {
          const supSelect = document.getElementById(`${pathStr}-${occ}-sup-select`);
          if (isClinicalActivity(val)) {
            supSelect.classList.remove('hidden');
          } else {
            supSelect.classList.add('hidden');
            state.rotPats[tmpl][slot][di].wo[occ].sup = '';
          }
        }
        
        // Update all months linked to this template for this slot
        Object.keys(state.mr).forEach(mKey => {
          const wr = state.mr[mKey];
          if (slot === 'am' && wr.amTemplate === tmpl) {
            wr.am = JSON.parse(JSON.stringify(state.rotPats[tmpl].am));
          } else if (slot === 'pm' && wr.pmTemplate === tmpl) {
            wr.pm = JSON.parse(JSON.stringify(state.rotPats[tmpl].pm));
          }
        });
      } else {
        // Edit override month cell directly
        const mKey = parts[0] + '-' + parts[1] + '-' + parts[2], slot = parts[3], di = Number(parts[4]);
        if (!state.mr[mKey][slot][di].wo) state.mr[mKey][slot][di] = emptyCell();
        state.mr[mKey][slot][di].wo[occ][key] = val;
        
        if (key === 'act') {
          const supSelect = document.getElementById(`${pathStr}-${occ}-sup-select`);
          if (isClinicalActivity(val)) {
            supSelect.classList.remove('hidden');
          } else {
            supSelect.classList.add('hidden');
            state.mr[mKey][slot][di].wo[occ].sup = '';
          }
        }
        // Force template unlink for overridden slot
        if (slot === 'am') {
          state.mr[mKey].amTemplate = 'none';
        } else {
          state.mr[mKey].pmTemplate = 'none';
        }
      }
      
      saveState();
    }
    function openCellModal(mKey, slot, di) {
      const cell = state.mr[mKey]?.[slot]?.[di] || emptyCell();
      const modal = document.getElementById('cell-edit-modal');
      const title = document.getElementById('cell-modal-title');
      const body = document.getElementById('cell-modal-body');
      
      title.innerText = `Override Cell (${WDAYS[di]} ${slot.toUpperCase()})`;
      body.innerHTML = getWeekRowsEditFormHtml(`${mKey}-${slot}-${di}`, cell.wo);
      modal.classList.remove('hidden');

    function closeCellModal() {
      document.getElementById('cell-edit-modal').classList.add('hidden');

    function exportRotICS(fellow) {
      const evts = [];
      MONTHS.forEach(({ y, m }) => {
        const mKey = `${fellow}-${y}-${m}`;
        const wr = state.mr[mKey]; if (!wr) return;
        const totalDays = new Date(y, m + 1, 0).getDate();
        
        for (let d = 1; d <= totalDays; d++) {
          const date = new Date(y, m, d);
          const dow = date.getDay();
          if (dow < 1 || dow > 5 || isHol(y, m, d)) continue;
          
          const cell = resolveCell(state.mr, fellow, y, m, date);
          if (cell) {
            const startDStr = fds(y, m, d);
            
            if (cell.am?.act) {
              evts.push({
                s: startDStr + 'T090000', e: startDStr + 'T120000',
                title: `AM: ${cell.am.act} [${cell.am.sup || 'No Supervisor'}]`,
                desc: `Rotation slot`
              });
            }
            if (cell.pm?.act) {
              evts.push({
                s: startDStr + 'T130000', e: startDStr + 'T160000',
                title: `PM: ${cell.pm.act} [${cell.pm.sup || 'No Supervisor'}]`,
                desc: `Rotation slot`
              });
            }
          }
        }
      });
      
      const ics = genICS(evts);
      downloadFile(ics, `${fellow}_glaucoma_rotation.ics`, 'text/calendar');
    }

    function toggleOnCallDay(ds) {
      if (!session.unlocked) {
        alert('🔒 Admin access required to change duty assignments.\n\nBook an off-day is still available without login.');
        return;
      }
      const cur = state.call[ds];
      const isSSOff = getOffDutyFellow(ds) === 'SS';
      const isMNOff = getOffDutyFellow(ds) === 'MN';
      
      if (isSSOff && isMNOff) {
        alert("Both fellows are off-duty on this day!");
        return;
      }
      
      if (!cur) {
        if (!isSSOff) {
          state.call[ds] = 'SS';
        } else {
          state.call[ds] = 'MN';
        }
      } else if (cur === 'SS') {
        if (!isMNOff) {
          state.call[ds] = 'MN';
        } else {
          delete state.call[ds];
        }
      } else {
        delete state.call[ds];
      }
      saveState();
      renderActiveTab();
    }

    function reBalanceOnCall() {
      if (!session.unlocked) {
        alert('🔒 Admin access required to re-balance duty.');
        return;
      }
      const allStats = getOnCallStatsAll();
      const totalDays = Object.keys(state.call).length;
      if (confirm('🔄 Auto Re-Balance On-Call Schedule? This will redistribute on-call shifts evenly to resolve load imbalances.')) {
        // Redo oncall schedule evenly
        const { y, m } = MONTHS[session.cMi];
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        
        let turn = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = dStr(new Date(y, m, d));
          const od = getOffDutyFellow(ds);
          
          if (od) {
            // Book the other fellow on-call
            state.call[ds] = od === 'SS' ? 'MN' : 'SS';
          } else {
            state.call[ds] = turn === 0 ? 'SS' : 'MN';
            turn = 1 - turn;
          }
        }
        
        saveState();
        renderActiveTab();
      }
    }

    function getOnCallStatsAll() {
      const total = { SS: { night: 0, wknd: 0, hol: 0 }, MN: { night: 0, wknd: 0, hol: 0 } };
      const monthly = MONTHS.map(({ y, m, lb }) => {
        const s = { lb, SS: { night: 0, wknd: 0, hol: 0 }, MN: { night: 0, wknd: 0, hol: 0 } };
        for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
          const ds = dStr(new Date(y, m, d)), c = state.call[ds];
          if (c && s[c]) {
            const dow = new Date(y, m, d).getDay();
            const hol = isHol(y, m, d);
            const isWk = dow === 0 || dow === 6;
            
            if (hol) {
              s[c].hol++;
              total[c].hol++;
            } else if (isWk) {
              s[c].wknd++;
              total[c].wknd++;
            } else {
              s[c].night++;
              total[c].night++;
            }
          }
        }
        return s;
      });
      return { total, monthly };
    }

                  <button onclick="setCasesFellow('MN')" class="px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${session.activeRotFellow === 'MN' ? 'bg-orange-600 text-white' : 'text-slate-400 hover:text-white'}">MN</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                ${Object.entries(caseStats[session.activeRotFellow]?.byProc || {}).sort((a,b) => b[1]-a[1]).map(([proc, n]) => {
                  const tgt = (state.sett.targets || {})[proc] || 0;
                  const pct = tgt > 0 ? Math.min(100, n/tgt*100) : 0;
                  const col = pct >= 100 ? 'bg-emerald-500' : pct >= 50 ? 'bg-amber-500' : 'bg-rose-500';
                  return `<div class="bg-slate-955/40 border border-white/5 rounded-2xl p-3 cursor-pointer hover:bg-slate-800/20" onclick="openDrillModal('${proc}','${session.activeRotFellow}')">
                    <div class="flex justify-between text-xs mb-1.5">
                      <span class="text-slate-300 font-semibold truncate underline max-w-[70%]">${proc}</span>
                      <span class="font-bold text-slate-200">${n}${tgt > 0 ? ` <span class="text-[10px] text-slate-500">/ ${tgt}</span>` : ''}</span>
                    </div>
                    ${tgt > 0 ? `<div class="h-1.5 bg-slate-900 rounded-full overflow-hidden"><div class="h-full rounded-full ${col}" style="width:${pct}%"></div></div>` : ''}
                  </div>`;
                }).join('')}
                ${Object.keys(caseStats[session.activeRotFellow]?.byProc || {}).length === 0 ? `<div class="col-span-2 text-center text-slate-500 py-4 text-xs">No cases logged yet.</div>` : ''}
              </div>
            </div>
          ` : ''}

          <!-- Main Case view container -->
          <div id="cases-content-view"></div>
        </div>
      `;

      const contentView = container.querySelector('#cases-content-view');
      
      if (session.caseViewMode === 'table') {
        // Render List View
        const isAcademic = session.activeCasesTab === 'academic';
        const searchPlaceholder = isAcademic
          ? "Search presentations by type, topic, supervisor or notes..."
          : "Search by HN, Procedure, Diagnosis or Supervisor...";

        contentView.innerHTML = `
          <div class="glass-card rounded-3xl p-5 border border-white/5 space-y-4">
            <div class="flex items-center gap-3">
              <input 
                type="text" 
                id="cases-search-bar" 
                placeholder="${searchPlaceholder}" 
                value="${session.orSearch}"
                oninput="handleCasesSearch(this.value)"
                class="flex-1 bg-slate-955/80 text-xs border border-white/5 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition-all placeholder-slate-500"
              >
              ${session.orSearch ? `<button onclick="handleCasesSearch('')" class="text-xs text-slate-400 hover:text-white font-bold px-2">Clear</button>` : ''}
            </div>

            <div class="overflow-x-auto rounded-2xl border border-white/5 bg-slate-955/20">
              <table class="w-full text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-900 border-b border-white/5 text-slate-400 font-bold uppercase tracking-wider text-left">
                    <th class="p-3">Date</th>
                    ${isAcademic ? `
                      <th class="p-3">Type</th>
                      <th class="p-3">Topic / Title</th>
                      <th class="p-3">Fellow</th>
                      <th class="p-3">Moderator / Staff</th>
                    ` : `
                      <th class="p-3">HN</th>
                      <th class="p-3">${session.activeCasesTab === 'logged' ? 'Fellow' : 'Surgeon'}</th>
                      <th class="p-3">Procedure</th>
                      <th class="p-3">Diagnosis</th>
                      <th class="p-3">Supervisor</th>
                      ${session.activeCasesTab === 'preop' ? '<th class="p-3">Status</th>' : ''}
                    `}
                    <th class="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5" id="cases-list-tbody"></tbody>
              </table>
            </div>
          </div>
        `;
        renderCasesList();
      } else {
        // Render Calendar View
        const calCard = document.createElement('div');
        calCard.className = 'glass-card rounded-3xl p-5 border border-white/5 space-y-4';
        contentView.appendChild(calCard);

        const calHeader = document.createElement('div');
        calHeader.className = 'grid grid-cols-7 gap-1 text-center text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-2';
        calHeader.innerHTML = '<div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div class="text-rose-400">Sa</div><div class="text-rose-400">Su</div>';
        calCard.appendChild(calHeader);

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-7 gap-1.5';
        calCard.appendChild(grid);

        sDays.forEach((date) => {
          if (!date) {
            const empty = document.createElement('div');
            empty.className = 'aspect-square bg-slate-900/10 rounded-xl opacity-30';
            grid.appendChild(empty);
            return;
          }

          const d = date.getDate(), dow = date.getDay(), isWk = dow === 0 || dow === 6, hol = isHol(y, m, d);
          const ds = dStr(date);
          const isSelected = session.selectedDate === ds;
          
          const ssC = resolveCell(state.mr, 'SS', y, m, date);
          const mnC = resolveCell(state.mr, 'MN', y, m, date);
          const preCases = state.preop.filter(e => e.date === ds && e.status !== 'Done');
          const orCases = state.orLog.filter(e => e.date === ds);
          const acadCases = (state.academicLog || []).filter(e => e.date === ds);
          
          const ssHasOR = ssC?.am?.act === 'OR' || ssC?.pm?.act === 'OR';
          const mnHasOR = mnC?.am?.act === 'OR' || mnC?.pm?.act === 'OR';
          
          let cellContent = '';
          if (!isWk && !hol) {
            if (ssHasOR) {
              const ssAM = ssC?.am?.act === 'OR' ? 'AM' : '';
              const ssPM = ssC?.pm?.act === 'OR' ? 'PM' : '';
              const ssLabel = [ssAM, ssPM].filter(Boolean).join('&') + ' OR';
              cellContent += `
                <div class="flex gap-1 items-center w-full">
                  <span class="text-[7.5px] bg-blue-600 text-white px-0.5 rounded font-extrabold shrink-0">SS</span>
                  <span class="text-slate-300 truncate text-[7.5px]" title="SS OR: ${ssLabel}">${ssLabel} ${ssC?.am?.sup ? `(${ssC.am.sup})` : ''}</span>
                </div>
              `;
            }
            if (mnHasOR) {
              const mnAM = mnC?.am?.act === 'OR' ? 'AM' : '';
              const mnPM = mnC?.pm?.act === 'OR' ? 'PM' : '';
              const mnLabel = [mnAM, mnPM].filter(Boolean).join('&') + ' OR';
              cellContent += `
                <div class="flex gap-1 items-center w-full">
                  <span class="text-[7.5px] bg-orange-600 text-white px-0.5 rounded font-extrabold shrink-0">MN</span>
                  <span class="text-slate-355 truncate text-[7.5px]" title="MN OR: ${mnLabel}">${mnLabel} ${mnC?.am?.sup ? `(${mnC.am.sup})` : ''}</span>
                </div>
              `;
            }
          }

          const todayStr = dStr(new Date());
          const isToday = ds === todayStr;

          const dayCell = document.createElement('div');
          dayCell.className = `p-1 rounded-xl flex flex-col items-start justify-between border cursor-pointer transition-all hover:bg-slate-800/40 relative select-none ${
            isSelected
              ? 'selected-cell'
              : isToday
                ? 'today-cell'
                : hol
                  ? 'bg-pink-955/10 border-pink-900/30'
                  : isWk
                    ? 'bg-slate-900/10 border-transparent text-slate-400'
                    : 'border-white/5 bg-slate-900/40'
          }`;
          dayCell.style.minHeight = '90px';
          dayCell.onclick = () => {
            session.selectedDate = isSelected ? null : ds;
            renderActiveTab();
          };

          dayCell.innerHTML = `
            <div class="flex justify-between items-center w-full px-0.5">
              <span class="text-[10px] font-bold ${hol ? 'text-pink-400' : isWk ? 'text-slate-400' : 'text-slate-300'}">${d}</span>
              ${hol ? `<span class="text-[7px] text-pink-400 truncate max-w-[40px] font-medium" title="${TH_HOL[hk(y,m,d)]}">${TH_HOL[hk(y,m,d)]}</span>` : ''}
            </div>
            ${!isWk && !hol ? `
              <div class="text-[8px] space-y-0.5 w-full mt-1">
                ${cellContent}
              </div>
              <div class="flex gap-1 mt-auto flex-wrap">
                ${preCases.length ? `<span class="text-[8px] font-bold bg-amber-900/40 text-amber-300 px-1 rounded inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span><span>${preCases.length}</span></span>` : ''}
                ${orCases.length  ? `<span class="text-[8px] font-bold bg-rose-900/40 text-rose-300 px-1 rounded inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 shrink-0"></span><span>${orCases.length}</span></span>`  : ''}
                ${acadCases.length ? `<span class="text-[8px] font-bold bg-blue-900/40 text-blue-300 px-1 rounded inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0"></span><span>${acadCases.length}</span></span>`  : ''}
              </div>
            ` : isWk ? `
              <div class="text-[8px] text-slate-400 mt-auto">Wknd</div>
            ` : `
              <div class="text-[8px] text-pink-400 mt-auto">Hol</div>
            `}
          `;
          grid.appendChild(dayCell);
        });

        const legend = document.createElement('div');
        legend.className = 'flex flex-wrap gap-x-3 gap-y-1.5 pt-3 border-t border-white/5 text-[10px] text-slate-400 justify-center';
        legend.innerHTML = `
          <span class="flex items-center gap-1"><span class="w-3 h-2 rounded bg-rose-600/80"></span> Completed OR Log (🔴)</span>
          <span class="flex items-center gap-1"><span class="w-3 h-2 rounded bg-amber-600/80"></span> Pre-Op Case (🟡)</span>
          <span class="flex items-center gap-1"><span class="w-3 h-2 rounded bg-blue-600/80"></span> Academic Log (📚)</span>
          <span class="text-slate-500 ml-2">Tip: Click date grid cell to toggle details panel below.</span>
        `;
        calCard.appendChild(legend);

        // Day Details Panel (rendered below calendar if selectedDate is set)
        if (session.selectedDate) {
          const ds = session.selectedDate;
          const [cy, cm, cd] = ds.split('-').map(Number);
          const sDateObj = new Date(cy, cm - 1, cd);
          const displayDate = sDateObj.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
          
          const ssC = resolveCell(state.mr, 'SS', cy, cm - 1, sDateObj);
          const mnC = resolveCell(state.mr, 'MN', cy, cm - 1, sDateObj);
          
          const preCases = state.preop.filter(e => e.date === ds && e.status !== 'Done');
          const orCases  = state.orLog.filter(e => e.date === ds);
          const acadCases = (state.academicLog || []).filter(e => e.date === ds);
          
          const detailCard = document.createElement('div');
          detailCard.className = 'glass-card rounded-3xl p-5 border border-blue-900/60 space-y-4 mt-4';
          
          detailCard.innerHTML = `
            <div class="flex items-center justify-between border-b border-white/5 pb-2">
              <h4 class="font-outfit font-extrabold text-sm text-slate-100 flex items-center gap-1.5">📅 ${displayDate}</h4>
              <button onclick="closeCasesDetailPanel()" class="text-slate-500 hover:text-slate-355 font-bold text-xs" aria-label="Close panel">✕</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- SS Fellow Rotation -->
              <div class="bg-blue-955/10 border border-blue-900/30 rounded-2xl p-3.5 space-y-2">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-blue-600 text-white">SS Fellow</span>
                <div class="text-xs space-y-1 text-slate-300 pt-1">
                  <div>AM: <b>${ssC?.am?.act || 'OPD'}</b> ${ssC?.am?.sup ? `<span class="text-slate-500">(${ssC.am.sup})</span>` : ''}</div>
                  <div>PM: <b>${ssC?.pm?.act || 'OPD'}</b> ${ssC?.pm?.sup ? `<span class="text-slate-500">(${ssC.pm.sup})</span>` : ''}</div>
                </div>
              </div>
              
              <!-- MN Fellow Rotation -->
              <div class="bg-orange-955/10 border border-orange-955/40 rounded-2xl p-3.5 space-y-2">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-orange-600 text-white">MN Fellow</span>
                <div class="text-xs space-y-1 text-slate-300 pt-1">
                  <div>AM: <b>${mnC?.am?.act || 'OPD'}</b> ${mnC?.am?.sup ? `<span class="text-slate-500">(${mnC.am.sup})</span>` : ''}</div>
                  <div>PM: <b>${mnC?.pm?.act || 'OPD'}</b> ${mnC?.pm?.sup ? `<span class="text-slate-500">(${mnC.pm.sup})</span>` : ''}</div>
                </div>
              </div>
            </div>

            <!-- Pre-Op Section -->
            <div class="space-y-2 border-t border-white/5 pt-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-amber-450">🟡 Pre-Op (${preCases.length})</span>
                <button onclick="addCaseAtDate('${ds}', 'preop')" class="text-amber-455 hover:text-amber-300 font-bold text-[10px] bg-amber-955/20 border border-amber-800/30 px-2.5 py-1 rounded-xl">＋ Add Pre-Op</button>
              </div>
              <div class="space-y-2">
                ${preCases.length === 0 ? '<div class="text-xs text-slate-500 pl-2">No pre-op patients for this day.</div>' : preCases.map(po => `
                  <div class="bg-slate-900/40 border border-white/5 rounded-2xl p-3 flex items-center justify-between text-xs hover:bg-slate-800/30 transition-all">
                    <div>
                      <div class="font-bold text-slate-200">${po.procedure || '—'} (${po.laterality || ''})</div>
                      <div class="text-[10px] text-slate-400 mt-0.5">HN: ${po.HN || '—'} &middot; Surgeon: ${po.surgeon || '—'} &middot; Supervisor: ${po.supervisor || '—'}</div>
                      ${po.notes ? `<div class="text-[10px] text-slate-500 italic mt-0.5">${po.notes}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="togglePreopStatus('${po.id}')" class="px-2.5 py-1 rounded-xl text-[10px] font-bold border transition-all ${
                        po.status === 'Confirmed'
                          ? 'bg-emerald-955/45 text-emerald-450 border-emerald-800/40 font-extrabold'
                          : 'bg-slate-900 text-slate-400 border-white/5'
                      }">
                        ${po.status === 'Confirmed' ? '🟢 Confirmed' : '⚪ Scheduled'}
                      </button>
                      ${po.status === 'Confirmed' ? `<button onclick="promoteToOR('${po.id}')" class="px-2.5 py-1 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-[10px] transition-all">→ OR</button>` : ''}
                      <button onclick="editCase('${po.id}')" class="text-blue-455 hover:underline font-bold text-[10px]">Edit</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Completed OR Section -->
            <div class="space-y-2 border-t border-white/5 pt-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-rose-450">🔴 OR Done (${orCases.length})</span>
                <button onclick="addCaseAtDate('${ds}', 'logged')" class="text-rose-455 hover:text-rose-300 font-bold text-[10px] bg-rose-955/20 border border-rose-900/30 px-2.5 py-1 rounded-xl">＋ Log Case</button>
              </div>
              <div class="space-y-2">
                ${orCases.length === 0 ? '<div class="text-xs text-slate-500 pl-2">No completed cases logged for this day.</div>' : orCases.map(oc => `
                  <div class="bg-slate-900/40 border border-white/5 rounded-2xl p-3 flex items-center justify-between text-xs hover:bg-slate-800/30 transition-all">
                    <div>
                      <div class="font-bold text-slate-200">${oc.procedure || '—'} (${oc.laterality || ''})</div>
                      <div class="text-[10px] text-slate-400 mt-0.5">HN: ${oc.HN || '—'} &middot; Fellow: ${oc.fellow || '—'} &middot; Supervisor: ${oc.supervisor || '—'}</div>
                      ${oc.notes ? `<div class="text-[10px] text-slate-500 italic mt-0.5">${oc.notes}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="editCase('${oc.id}')" class="text-blue-455 hover:underline font-bold text-[10px]">Edit</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Academic Presentation Section -->
            <div class="space-y-2 border-t border-white/5 pt-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-blue-400">📚 Academic Presentations (${acadCases.length})</span>
                <button onclick="addAcademicAtDate('${ds}')" class="text-blue-450 hover:text-blue-300 font-bold text-[10px] bg-blue-955/20 border border-blue-900/30 px-2.5 py-1 rounded-xl">＋ Log Presentation</button>
              </div>
              <div class="space-y-2">
                ${acadCases.length === 0 ? '<div class="text-xs text-slate-500 pl-2">No academic presentations logged for this day.</div>' : acadCases.map(ap => `
                  <div class="bg-slate-900/40 border border-white/5 rounded-2xl p-3 flex items-center justify-between text-xs hover:bg-slate-800/30 transition-all">
                    <div>
                      <div class="font-bold text-slate-200">${ap.type}: ${ap.topic || '—'}</div>
                      <div class="text-[10px] text-slate-400 mt-0.5">Fellow: ${ap.fellow || '—'} &middot; Staff: ${ap.supervisor || '—'}</div>
                      ${ap.notes ? `<div class="text-[10px] text-slate-500 italic mt-0.5">${ap.notes}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="editAcademic('${ap.id}')" class="text-blue-455 hover:underline font-bold text-[10px]">Edit</button>
                      <button onclick="deleteAcademic('${ap.id}')" class="text-rose-455 hover:underline font-bold text-[10px]">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
          contentView.appendChild(detailCard);
        }
      }
    }

    function setCasesTab(tab) {
      session.activeCasesTab = tab;
      renderActiveTab();
    }
    
    function handleCasesSearch(q) {
      session.orSearch = q;
      renderCasesList();
    }

    function renderCasesList() {
      const tbody = document.getElementById('cases-list-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const isAcademic = session.activeCasesTab === 'academic';
      const list = isAcademic
        ? (state.academicLog || [])
        : session.activeCasesTab === 'logged'
          ? state.orLog
          : state.preop;
          
      const q = session.orSearch.toLowerCase();
      
      const filtered = list.filter(e => {
        if (!q) return true;
        if (isAcademic) {
          return (e.type || '').toLowerCase().includes(q) || 
                 (e.topic || '').toLowerCase().includes(q) || 
                 (e.supervisor || '').toLowerCase().includes(q) || 
                 (e.notes || '').toLowerCase().includes(q);
        }
        return (e.HN || '').toLowerCase().includes(q) || 
               (e.name || '').toLowerCase().includes(q) || 
               (e.procedure || '').toLowerCase().includes(q) || 
               (e.supervisor || '').toLowerCase().includes(q) || 
               (e.diagnosis || '').toLowerCase().includes(q) || 
               (e.notes || '').toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isAcademic ? 6 : session.activeCasesTab === 'preop' ? 8 : 7}" class="p-8 text-center text-slate-500 font-medium">No log entries match your filters.</td></tr>`;
        return;
      }

      // Sort by date descending
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      filtered.forEach(e => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-900/30 transition-all font-medium';
        
        const dateObj = new Date(e.date + 'T12:00:00');
        const formattedDate = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        
        if (isAcademic) {
          tr.innerHTML = `
            <td class="p-3 text-slate-350 whitespace-nowrap">${formattedDate}</td>
            <td class="p-3 text-slate-200">
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${e.type === 'Journal Club' ? 'bg-indigo-900/40 text-indigo-300' : 'bg-pink-900/40 text-pink-300'}">${e.type}</span>
            </td>
            <td class="p-3 text-slate-200 truncate max-w-[200px]"><b>${e.topic || '—'}</b>${e.notes ? `<span class="text-[10px] text-slate-400 block font-normal italic truncate">${e.notes}</span>` : ''}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${e.fellow === 'SS' ? 'bg-blue-900/40 text-blue-300' : 'bg-orange-900/40 text-orange-300'}">${e.fellow}</span>
            </td>
            <td class="p-3 text-slate-300">${e.supervisor || '—'}</td>
            <td class="p-3 text-right whitespace-nowrap">
              <button onclick="editAcademic('${e.id}')" class="text-blue-455 hover:underline mr-2 font-bold text-[10px]">Edit</button>
              <button onclick="deleteAcademic('${e.id}')" class="text-rose-455 hover:underline font-bold text-[10px]">Delete</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td class="p-3 text-slate-300 whitespace-nowrap">${formattedDate}</td>
            <td class="p-3 text-slate-200">
              <b>${e.HN}</b> ${e.laterality ? `<span class="text-[9px] text-slate-500 uppercase">${e.laterality}</span>` : ''}
              ${e.name ? `<span class="text-[10px] text-slate-400 block font-normal truncate">${e.name}</span>` : ''}
            </td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${e.fellow === 'SS' || e.surgeon === 'SS' ? 'bg-blue-900/40 text-blue-300' : 'bg-orange-900/40 text-orange-300'}">${e.fellow || e.surgeon}</span></td>
            <td class="p-3 text-slate-200 truncate max-w-[150px]">
              <b>${e.procedure || '—'}</b>
              ${e.notes ? `<span class="text-[10px] text-slate-400 block font-normal italic truncate" title="${e.notes}">${e.notes}</span>` : ''}
            </td>
            <td class="p-3 text-slate-400 truncate max-w-[150px]">${e.diagnosis || '—'}</td>
            <td class="p-3 text-slate-300">${e.supervisor || '—'}</td>

    function checkDuplicate(hn, procedure, date) {
      if (!hn) return null;
      const dateObj = new Date(date + 'T12:00:00');
      const cutoff = new Date(dateObj.getTime() - 7 * 86400000);
      const cy = cutoff.getFullYear();
      const cm = String(cutoff.getMonth() + 1).padStart(2, '0');
      const cd = String(cutoff.getDate()).padStart(2, '0');
      const cutoffStr = `${cy}-${cm}-${cd}`;

      return state.orLog.find(e =>
        e.HN === hn &&
        e.procedure === procedure &&
        e.date >= cutoffStr &&
        e.date <= date
      ) || null;
    }

    function saveCaseFromModal() {
      const type = document.getElementById('case-edit-type').value;
      const id = document.getElementById('case-edit-id').value;
      
      const date = document.getElementById('case-date').value;
      const hn = document.getElementById('case-hn').value.trim();
      const name = document.getElementById('case-name').value.trim();
      const fellow = document.getElementById('case-fellow').value;
      const laterality = document.getElementById('case-laterality').value;
      const procedure = document.getElementById('case-proc').value;
      const diagnosis = document.getElementById('case-diag').value;
      const supervisor = document.getElementById('case-sup').value;
      const notes = document.getElementById('case-notes').value.trim();
      
      if (!hn) { alert('HN Number is required'); return; }
      
      if (type === 'logged' && !id) {
        const dupe = checkDuplicate(hn, procedure, date);
        if (dupe) {
          const proceed = confirm(
            `⚠️ Possible Duplicate\n\n` +
            `HN ${hn} — ${procedure}\n` +
            `was already logged on ${dupe.date}.\n\n` +
            `Save anyway?`
          );
          if (!proceed) return;
        }
      }
      
      const entry = {
        id: id || 'c_' + Math.random().toString(36).substring(2, 9),
        date,
        HN: hn,
        name,
        laterality,
        procedure,
        diagnosis,
        supervisor,
        notes
      };

      if (type === 'logged') {
        entry.fellow = fellow;
        if (id) {
          state.orLog = state.orLog.map(e => e.id === id ? entry : e);
        } else {
          state.orLog.push(entry);
        }
      } else {
        entry.surgeon = fellow;
        entry.status = document.getElementById('case-status').value;
        entry.readyForSurgery = (entry.status === 'Confirmed');
        
        if (entry.status === 'Done') {
          // Move to Completed OR List automatically
          if (confirm('Moving status to "Done" will automatically log this as a Completed OR Case. Continue?')) {
            const completed = { ...entry, fellow: entry.surgeon, id: 'c_' + Math.random().toString(36).substring(2, 9) };
            delete completed.status;
            delete completed.readyForSurgery;
            delete completed.surgeon;
            
            state.orLog.push(completed);
            if (id) {
              state.preop = state.preop.filter(e => e.id !== id);
            }
          } else {
            return;
          }
        } else {
          if (id) {
            state.preop = state.preop.map(e => e.id === id ? entry : e);
          } else {
            state.preop.push(entry);
          }
        }
      }

      saveState();
      closeCaseModal();
      renderActiveTab();
    }

    function exportMultiSheetExcel() {
      let xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 <DocumentProperties xmlns="urn:schemas-microsoft-com:office:office">
  <Author>Glaucoma Fellowship Portal</Author>
  <Created>${new Date().toISOString()}</Created>
 </DocumentProperties>
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Bottom"/>
   <Borders/>
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Color="#000000"/>
   <Interior/>
   <NumberFormat/>
   <Protection/>
  </Style>
  <Style ss:ID="Header">
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>
   <Interior ss:Color="#1F4E78" ss:Pattern="Solid"/>
  </Style>
  <Style ss:ID="DateStyle">
   <NumberFormat ss:Format="yyyy\-mm\-dd"/>
  </Style>
 </Styles>`;

      const escapeXML = (str) => {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      };

      const createWorksheet = (name, headers, rows) => {
        let s = `\n <Worksheet ss:Name="${escapeXML(name)}">\n  <Table>\n`;
        s += '   <Row ss:StyleID="Header">\n';
        headers.forEach(h => {
          s += `    <Cell><Data ss:Type="String">${escapeXML(h)}</Data></Cell>\n`;
        });
        s += '   </Row>\n';

        rows.forEach(r => {
          s += '   <Row>\n';
          r.forEach(val => {
            let type = 'String';
            let styleAttr = '';
            if (typeof val === 'number') {
              type = 'Number';
            } else if (val instanceof Date) {
              type = 'DateTime';
              val = val.toISOString().substring(0, 10);
              styleAttr = ' ss:StyleID="DateStyle"';
            }
            s += `    <Cell${styleAttr}><Data ss:Type="${type}">${escapeXML(val)}</Data></Cell>\n`;
          });
          s += '   </Row>\n';
        });

        s += '  </Table>\n </Worksheet>';
        return s;
      };

      // 1. OR Log Worksheet
      const orHeaders = ['Date', 'HN', 'Fellow', 'Procedure', 'Diagnosis', 'Laterality', 'Supervisor', 'Notes'];
      const orRows = state.orLog.map(r => [
        r.date || '',
        r.HN || '',
        r.fellow || '',
        r.procedure || '',
        r.diagnosis || '',
        r.laterality || '',
        r.supervisor || '',
        r.notes || ''
      ]);
      xml += createWorksheet('OR Log', orHeaders, orRows);

      // 2. Pre-Op List Worksheet
      const preopHeaders = ['Date', 'HN', 'Surgeon', 'Procedure', 'Diagnosis', 'Laterality', 'Supervisor', 'Status', 'Notes'];
      const preopRows = state.preop.map(r => [
        r.date || '',
        r.HN || '',
        r.surgeon || '',
        r.procedure || '',
        r.diagnosis || '',
        r.laterality || '',
        r.supervisor || '',
        r.status || '',
        r.notes || ''
      ]);
      xml += createWorksheet('Pre-Op List', preopHeaders, preopRows);

      // 3. On-Call & Off-Duty Worksheet
      const allDates = new Set([...Object.keys(state.call), ...Object.keys(state.offDuty)]);
      const callHeaders = ['Date', 'On-Call Fellow', 'Off-Duty Fellow'];
      const callRows = Array.from(allDates)
        .sort()
        .map(ds => [
          ds,
          state.call[ds] || '',
          getOffDutyFellow(ds) || ''
        ]);
      xml += createWorksheet('On-Call & Off-Duty', callHeaders, callRows);

      // 4. Rotation Schedule Worksheet
      const rotHeaders = ['Date', 'Fellow', 'AM Activity', 'AM Supervisor', 'PM Activity', 'PM Supervisor'];
      const rotRows = [];
      MONTHS.forEach(({ y, m }) => {
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(y, m, d);
          const dow = date.getDay();
          if (dow >= 1 && dow <= 5) {
            const ds = dStr(date);
            ['SS', 'MN'].forEach(fel => {
              const resolved = resolveCell(state.mr, fel, y, m, date);
              if (resolved) {
                rotRows.push([
                  ds,
                  fel,
                  resolved.am.act,
                  resolved.am.sup,
                  resolved.pm.act,
                  resolved.pm.sup
                ]);
              }
            });
          }
        }
      });
      xml += createWorksheet('Rotation Schedule', rotHeaders, rotRows);

      // 5. Settings & Targets Worksheet
      const settingsHeaders = ['Procedure / Config Name', 'Target / Value', 'Description'];
      const settingsRows = [];
      Object.entries(state.sett.targets || {}).forEach(([proc, tgt]) => {
        settingsRows.push([`Target: ${proc}`, tgt, 'Surgical minimum cases target']);
      });
      if (state.sett.procs) {
        settingsRows.push(['Procedures List', state.sett.procs.join(', '), 'Configured procedures']);
      }
      if (state.sett.sups) {
        settingsRows.push(['Supervisors List', state.sett.sups.join(', '), 'Configured supervisor names']);
      }
      xml += createWorksheet('Settings & Targets', settingsHeaders, settingsRows);

      xml += '\n</Workbook>';

      const dateStr = new Date().toISOString().slice(0, 10);
      downloadFile(xml, `Fellowship_Backup_${dateStr}.xls`, 'application/vnd.ms-excel');
    }

    function addRotationActivity() {
      const input = document.getElementById('settings-new-act-name');
      const clinicalInput = document.getElementById('settings-new-act-clinical');
      const name = input.value.trim();
      if (!name) return;
      if (!state.sett.acts) state.sett.acts = [];
      
      if (!state.sett.acts.some(a => a.name.toLowerCase() === name.toLowerCase())) {
        state.sett.acts.push({
          name: name,
          clinical: clinicalInput.checked
        });
        saveState();
        renderSettingsLists();
        input.value = '';
        clinicalInput.checked = false;
      } else {
        alert('An activity with this name already exists.');

        renderSettingsLists();

    async function refreshBackupPanel() {
      // ── Local snapshots ──────────────────────────────────
      const localEl = document.getElementById('backup-local-list');
      if (localEl) {
        const snaps = listLocalSnapshots();
        if (snaps.length === 0) {
          localEl.innerHTML = '<p class="text-[10px] text-slate-500 italic">No local snapshots yet. They will appear after the next data change.</p>';
        } else {
          localEl.innerHTML = snaps.map((s, i) => {
            const dt = new Date(s.timestamp);
            const label = dt.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
            const totalCases = s.orLogCount + s.preopCount;
            return `
              <div class="flex items-center justify-between bg-slate-900/50 border border-white/5 rounded-xl px-3 py-2 gap-2">
                <div class="min-w-0">
                  <span class="text-[11px] font-semibold text-slate-300">${label}</span>
                  <span class="text-[10px] text-slate-500 ml-2">${s.orLogCount} cases · ${s.preopCount} pre-op</span>
                </div>
                <div class="flex gap-1.5 shrink-0">
                  <button onclick="doRestoreFromLocalSnap('${s.key}','merge')" class="text-[10px] px-2.5 py-1 rounded-lg bg-blue-700 hover:bg-blue-600 text-white font-bold transition-all">Merge</button>
                  <button onclick="doRestoreFromLocalSnap('${s.key}','overwrite')" class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold transition-all">Overwrite</button>
                </div>
              </div>`;
          }).join('');
        }
      }

      // ── Cloud snapshots ──────────────────────────────────
      const cloudEl = document.getElementById('backup-cloud-list');
      if (cloudEl) {
        cloudEl.innerHTML = '<p class="text-[10px] text-slate-500 italic">Fetching cloud snapshots…</p>';
        try {
          const cloudSnaps = await listCloudSnapshots();
          if (cloudSnaps.length === 0) {
            cloudEl.innerHTML = '<p class="text-[10px] text-slate-500 italic">No cloud snapshots yet. Tap 🛡️ Backup Now to create one.</p>';
          } else {
            cloudEl.innerHTML = cloudSnaps.map(s => {
              const dt = new Date(s.timestamp);
              const label = dt.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
              return `
                <div class="flex items-center justify-between bg-slate-900/50 border border-white/5 rounded-xl px-3 py-2 gap-2">
                  <div class="min-w-0">
                    <span class="text-[11px] font-semibold text-slate-300">☁️ ${label}</span>
                    <span class="text-[10px] text-slate-500 ml-2">${s.orLogCount} cases · ${s.preopCount} pre-op</span>
                  </div>
                  <div class="flex gap-1.5 shrink-0">
                    <button onclick="doRestoreFromCloudSnap('${s.key}','merge')" class="text-[10px] px-2.5 py-1 rounded-lg bg-blue-700 hover:bg-blue-600 text-white font-bold transition-all">Merge</button>
                    <button onclick="doRestoreFromCloudSnap('${s.key}','overwrite')" class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold transition-all">Overwrite</button>
                  </div>
                </div>`;
            }).join('');
          }
        } catch(e) {
          cloudEl.innerHTML = '<p class="text-[10px] text-rose-400 italic">Failed to load cloud snapshots.</p>';
        }
      }
    }

    function doRestoreFromLocalSnap(key, mode) {
      const raw = localStorage.getItem(key);
      if (!raw) { alert('❌ Snapshot not found in local storage.'); return; }
      try {
        const snap = JSON.parse(raw);
        const dt = new Date(snap.timestamp).toLocaleString('th-TH');
        const msg = mode === 'merge'
          ? `✅ Merge snapshot from ${dt} into current data?\n(Existing cases will be kept. Missing ones will be added.)`
          : `⚠️ OVERWRITE all current data with snapshot from ${dt}?\nThis cannot be undone!`;
        if (!confirm(msg)) return;
        restoreFromSnapshot(snap, mode);
        alert(`✅ Restore complete! ${mode === 'merge' ? 'Cases merged.' : 'Data replaced.'}`);
        renderActiveTab();
        refreshBackupPanel();
      } catch(e) { alert('❌ Failed to parse snapshot: ' + e.message); }
    }

    async function doRestoreFromCloudSnap(dateKey, mode) {
      if (!db) { alert('❌ Not connected to Firestore.'); return; }
      try {
        const doc = await db.collection(COL_BACKUPS).doc(dateKey).get();
        if (!doc.exists) { alert('❌ Cloud snapshot not found.'); return; }
        const snap = doc.data();
        const dt = new Date(snap.timestamp).toLocaleString('th-TH');
        const msg = mode === 'merge'
          ? `✅ Merge cloud snapshot from ${dt} into current data?`
          : `⚠️ OVERWRITE all current data with cloud snapshot from ${dt}?`;
        if (!confirm(msg)) return;
        restoreFromSnapshot(snap, mode);
        alert(`✅ Cloud restore complete! ${mode === 'merge' ? 'Cases merged.' : 'Data replaced.'}`);
        renderActiveTab();
        refreshBackupPanel();
      } catch(e) { alert('❌ Cloud restore failed: ' + e.message); }
    }

    function recoverLocalDeviceData() {
      let recoveredCount = 0;
      ['logbook', 'preop', 'tracker', 'schedule', 'oncall'].forEach(docId => {
        try {
          const raw = localStorage.getItem(dbKey(docId));
          if (raw) {
            const parsed = JSON.parse(raw);
            if (docId === 'logbook') {
              const { merged, addedLocalCount } = mergeEntries(parsed.entries || parsed.orLog, state.orLog);
              state.orLog = merged;
              recoveredCount += addedLocalCount;
            } else if (docId === 'preop') {
              const { merged, addedLocalCount } = mergeEntries(parsed.entries || parsed.preop, state.preop);
              state.preop = merged;
              recoveredCount += addedLocalCount;
            }
          }
        } catch(e) {
          console.warn("Local recovery check failed on " + docId, e);
        }
      });
      saveState();
      alert(`✅ Device Recovery Complete!\nRecovered ${recoveredCount} additional local cases. All data merged and synced.`);
      renderActiveTab();
    }

    function importJSONState(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.sett) state.sett = { ...state.sett, ...imported.sett };
          if (imported.rotPats) state.rotPats = imported.rotPats;
          if (imported.mr) state.mr = imported.mr;
          if (imported.call) state.call = { ...state.call, ...imported.call };
          if (imported.offDuty) state.offDuty = { ...state.offDuty, ...imported.offDuty };
          
          if (imported.orLog || imported.entries) {
            const { merged } = mergeEntries(imported.orLog || imported.entries, state.orLog);
            state.orLog = merged;
          }
          if (imported.preop) {
            const { merged } = mergeEntries(imported.preop, state.preop);
            state.preop = merged;
          }
          if (imported.study || imported.cards) {
            const { merged } = mergeEntries(imported.study || imported.cards, state.study);
            state.study = merged;
          }

          saveState();
          alert('✅ Database imported and merged successfully!');
          renderActiveTab();
        } catch (err) {
          alert('❌ Invalid JSON backup file');
          console.error(err);
        }
      };
      reader.readAsText(file);
    }

    // ── CASE LOG ANALYTICS DASHBOARD ──────────────────────
    function renderCaseAnalytics(container) {
      const monthsKey = ["2026-07", "2026-08", "2026-09", "2026-10", "2026-11", "2026-12", "2027-01", "2027-02", "2027-03", "2027-04", "2027-05", "2027-06"];
      const monthsLabel = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      
      const ssMonthly = Array(12).fill(0);
      const mnMonthly = Array(12).fill(0);

      state.orLog.forEach(e => {
        if (!e.date) return;
        const key = e.date.slice(0, 7); // YYYY-MM
        const idx = monthsKey.indexOf(key);
        if (idx !== -1) {
          if (e.fellow === 'SS') ssMonthly[idx]++;
          if (e.fellow === 'MN') mnMonthly[idx]++;
        }
      });

      const maxVal = Math.max(...ssMonthly, ...mnMonthly, 5);
      const chartHeight = 120;
      const chartWidth = 540;
      const paddingLeft = 30;
      const paddingRight = 10;
      const paddingTop = 15;
      const paddingBottom = 20;

      // Generate SVG Bars
      let barsHtml = '';
      const colWidth = (chartWidth - paddingLeft - paddingRight) / 12;
      
      for (let i = 0; i < 12; i++) {
        const x = paddingLeft + i * colWidth;
        const labelX = x + colWidth / 2;
        
        // SS (Blue) Bar
        const ssH = (ssMonthly[i] / maxVal) * chartHeight;
        const ssY = chartHeight + paddingTop - ssH;
        const ssBarWidth = colWidth * 0.35;
        const ssBarX = x + colWidth * 0.1;
        
        // MN (Orange) Bar
        const mnH = (mnMonthly[i] / maxVal) * chartHeight;
        const mnY = chartHeight + paddingTop - mnH;
        const mnBarWidth = colWidth * 0.35;
        const mnBarX = x + colWidth * 0.5;

        barsHtml += `
          <!-- Column ${monthsLabel[i]} -->
          <rect x="${ssBarX}" y="${ssY}" width="${ssBarWidth}" height="${ssH}" fill="#3b82f6" rx="2" class="transition-all hover:opacity-80"/>
          ${ssMonthly[i] > 0 ? `<text x="${ssBarX + ssBarWidth/2}" y="${ssY - 3}" fill="#93c5fd" font-size="8" font-weight="bold" text-anchor="middle">${ssMonthly[i]}</text>` : ''}

          <rect x="${mnBarX}" y="${mnY}" width="${mnBarWidth}" height="${mnH}" fill="#ea580c" rx="2" class="transition-all hover:opacity-80"/>
          ${mnMonthly[i] > 0 ? `<text x="${mnBarX + mnBarWidth/2}" y="${mnY - 3}" fill="#ffedd5" font-size="8" font-weight="bold" text-anchor="middle">${mnMonthly[i]}</text>` : ''}

          <!-- Month Label -->
          <text x="${labelX}" y="${chartHeight + paddingTop + 13}" fill="#94a3b8" font-size="9" text-anchor="middle" font-weight="bold">${monthsLabel[i]}</text>
        `;
      }

      // Grid Lines
      let gridLinesHtml = '';
      for (let gridIdx = 0; gridIdx <= 4; gridIdx++) {
        const gridVal = Math.round((maxVal / 4) * gridIdx);
        const y = chartHeight + paddingTop - (gridVal / maxVal) * chartHeight;
        gridLinesHtml += `
          <line x1="${paddingLeft}" y1="${y}" x2="${chartWidth - paddingRight}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2,2"/>
          <text x="${paddingLeft - 6}" y="${y + 3}" fill="#64748b" font-size="8" text-anchor="end">${gridVal}</text>
        `;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-outfit font-extrabold text-xs text-slate-200 uppercase tracking-wider">📈 Visual Case Analytics Dashboard</h3>
            <div class="flex gap-4 text-[10px] select-none">
              <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-blue-500 rounded"></span> SS Fellow</span>
              <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-orange-600 rounded"></span> MN Fellow</span>
            </div>
          </div>

          <div class="overflow-x-auto bg-slate-955/30 border border-white/5 rounded-2xl p-4">
            <svg viewBox="0 0 ${chartWidth} ${chartHeight + paddingTop + paddingBottom}" class="w-full min-w-[500px]" style="font-family: inherit;">
              <!-- Horizontal Grid and Y-axis labels -->
              ${gridLinesHtml}
              
              <!-- Axis baseline -->
              <line x1="${paddingLeft}" y1="${chartHeight + paddingTop}" x2="${chartWidth - paddingRight}" y2="${chartHeight + paddingTop}" stroke="rgba(255,255,255,0.1)"/>
              
              <!-- Bars & Labels -->
              ${barsHtml}
            </svg>
          </div>
        </div>
      `;
    }

        session.activeStudyTab = 'notes';

            <div class="flex gap-1.5 bg-slate-900/60 p-0.5 rounded-xl border border-white/5">
              <button onclick="setStudyTab('notes')" class="px-4 py-2 rounded-lg text-xs font-bold transition-all ${session.activeStudyTab === 'notes' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">🧠 Clinical Study Notes</button>
              <button onclick="setStudyTab('academic')" class="px-4 py-2 rounded-lg text-xs font-bold transition-all ${session.activeStudyTab === 'academic' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">📚 Academic Log</button>
            </div>
            
            <!-- Right Side: Actions -->
            <div>
              ${session.activeStudyTab === 'notes' ? `
                <button onclick="openStudyCardModal()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition-all">
                  ＋ Add Study Note
                </button>
              ` : `
                <button onclick="openNewAcademicModal()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition-all">
                  ＋ Log Presentation
                </button>
              `}
            </div>
          </div>

          ${session.activeStudyTab === 'notes' ? `
            <!-- Filters & Search -->
            <div class="flex items-center gap-3">
              <input 
                type="text" 
                id="study-search-bar" 
                placeholder="Search study notes by title, presentation, diagnosis or explanation..." 
                oninput="filterStudyCards(this.value)"
                class="w-full bg-slate-955/80 text-xs border border-white/5 rounded-xl px-3.5 py-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition-all placeholder-slate-500"
              >
            </div>

            <!-- Cards Grid -->
            <div id="study-cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1"></div>
          ` : `
            <!-- Academic Log View -->
            <div class="glass-card rounded-3xl p-5 border border-white/5 space-y-4">
              <div class="flex items-center justify-between border-b border-white/5 pb-2">
                <h3 class="font-outfit font-extrabold text-sm text-slate-100 flex items-center gap-2">📚 Academic Presentation Logbook</h3>
                <div class="flex items-center gap-3">
                  <input 
                    type="text" 
                    id="academic-search-bar" 
                    placeholder="Search presentations..." 
                    oninput="filterAcademicLogs(this.value)"
                    class="bg-slate-955/80 text-xs border border-white/5 rounded-xl px-3.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500 transition-all placeholder-slate-500 min-w-[200px]"
                  >
                </div>
              </div>
              
              <div class="overflow-x-auto rounded-2xl border border-white/5 bg-slate-955/20">
                <table class="w-full text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-900 border-b border-white/5 text-slate-400 font-bold uppercase tracking-wider text-left">
                      <th class="p-3">Date</th>
                      <th class="p-3">Type</th>
                      <th class="p-3">Topic / Presentation Title</th>
                      <th class="p-3">Fellow</th>
                      <th class="p-3">Moderator / Staff</th>
                      <th class="p-3 text-right">Actions</th>

                  </thead>

      if (session.activeStudyTab === 'notes') {
