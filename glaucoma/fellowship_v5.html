<!-- Cache Busting and Service Worker Nuclear Kill -->
<script>
  (async function() {
    // 1. Unregister ALL service workers immediately
    if ('serviceWorker' in navigator) {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
          console.log('[INIT] SW unregistered:', reg.scope);
        }
      } catch(e) {
        console.warn('[INIT] SW unregister error:', e);
      }
    }

    // 2. Clear ALL caches
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        for (const key of keys) {
          await caches.delete(key);
          console.log('[INIT] Cache deleted:', key);
        }
      } catch(e) {
        console.warn('[INIT] Cache clear error:', e);
      }
    }

    // 3. Listen for kill-switch SW message and hard-reload once
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'SW_KILLED') {
          console.log('[INIT] Kill-switch SW activated. Hard reloading...');
          if (!sessionStorage.getItem('sw_killed_reload')) {
            sessionStorage.setItem('sw_killed_reload', '1');
            window.location.reload(true);
          }
        }
      });
    }
  })();
</script>

  <!-- CORE APP CODE -->
  <script>
    // ── CONSTANTS ─────────────────────────────────────────
    const ACTS = ['OPD', 'OR', 'Research', 'JC', 'Clinic', 'Laser', 'Lecture', 'Self-study'];
    const DIAGS = ['POAG', 'PACG', 'NTG', 'PXG', 'Neovascular GLC', 'Uveitic GLC', 'Steroid GLC', 'Traumatic GLC', 'Secondary GLC', 'OHT', 'GLC Suspect', 'Congenital GLC'];

    const MONTHS = [
      { y: 2026, m: 6, lb: 'Jul 2026' }, { y: 2026, m: 7, lb: 'Aug 2026' }, { y: 2026, m: 8, lb: 'Sep 2026' },

      '2026-12-31': 'วันสิ้นปี', '2027-1-1': 'วันขึ้นปีใหม่', '2027-2-20': 'วันมาฆบูชา', '2027-4-6': 'วันจักรี',
      '2027-4-13': 'วันสงกรานต์', '2027-4-14': 'วันสงกรานต์', '2027-4-15': 'วันสงกรานต์', '2027-5-1': 'วันแรงงานแห่งชาติ',
      '2027-5-4': 'วันฉัตรมงคล', '2027-5-11': 'วันวิสาขบูชา'

      Lecture: 'bg-indigo-900/40 text-indigo-300 border-indigo-800/40',
      'Self-study': 'bg-slate-800/40 text-slate-300 border-slate-700/40'
    };
    
    const WDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    const TMPLS = ['A', 'B', 'C'];
    const LOCKED_TABS = ['rotation', 'oncall', 'settings'];

    const DEF_SETT = {
      lineWorkerUrl: '', ssLineId: '', mnLineId: '', morningNotifyTime: '06:00', eveningNotifyTime: '20:00', appPassword: '',
      targets: { Trabeculectomy: 20, 'Ahmed Valve': 10, 'MIGS–iStent': 5, CPC: 10, SLT: 20, 'YAG PI': 15 },
      sups: ['กุลวรรณ', 'นพคุณ', 'สุพัตรา', 'อรอร', 'ดวงดาว', 'เพ็ญพรรณ'],
      maOpts: ['Morning Report', 'Photo Quiz', 'Journal Club', 'Case Discussion', 'Grand Round', 'Interesting Case', 'M&M Conference', 'Laser Teaching'],
      procs: ['Trabeculectomy', 'Ahmed Valve', 'MIGS–iStent', 'MIGS–KDB Goniotomy', 'CPC', 'Bleb Revision', 'Needling+5FU', 'Phaco+Trab', 'SLT', 'YAG PI', 'ALT', '5-FU Injection', 'GATT', 'ECP'],
      morningActSched: ['Morning Report', 'Photo Quiz', 'Journal Club', 'Case Discussion', 'Grand Round']
    };

    // ── HELPERS ───────────────────────────────────────────
    const hk = (y, m, d) => `${y}-${m + 1}-${d}`; // Month is 1-indexed for holiday keys
    const isHol = (y, m, d) => !!TH_HOL[hk(y, m, d)];
    const fds = (y, m, d) => `${y}${String(m + 1).padStart(2, '0')}${String(d).padStart(2, '0')}`;
    const dStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const getOffDutyFellow = ds => {
      const entry = state.offDuty[ds];
      if (!entry) return null;
      return typeof entry === 'string' ? entry : (entry.fellow || null);
    };
    const getOffDutyReason = ds => {
      const entry = state.offDuty[ds];
      if (!entry) return '';
      return typeof entry === 'string' ? 'Off Duty' : (entry.reason || 'Off Duty');
    };
    const weekOcc = date => Math.ceil(date.getDate() / 7);
    const emptyCell = () => ({ wo: { 1: { act: 'OPD', sup: '' }, 2: { act: 'OPD', sup: '' }, 3: { act: 'OPD', sup: '' }, 4: { act: 'OPD', sup: '' }, 5: { act: 'OPD', sup: '' } } });
    const emptyRow = () => Array(5).fill(null).map(() => emptyCell());
    const emptyTpl = () => ({ am: emptyRow(), pm: emptyRow() });
    const initMR = () => {
      const r = {};
      MONTHS.forEach(({ y, m }) => ['SS', 'MN'].forEach(f => {
        r[`${f}-${y}-${m}`] = { amTemplate: 'none', pmTemplate: 'none', am: emptyRow(), pm: emptyRow() };
      }));
      return r;
    };

    function resolveCell(mr, fel, y, m, date) {
      const wr = mr?.[`${fel}-${y}-${m}`]; if (!wr) return null;
      const dow = date.getDay(); if (dow < 1 || dow > 5) return null;
      const di = dow - 1, occ = weekOcc(date);
      const amCell = wr.am?.[di]; const pmCell = wr.pm?.[di];
      const amW = amCell?.wo?.[occ] || { act: '', sup: '' };
      const pmW = pmCell?.wo?.[occ] || { act: '', sup: '' };
      return { am: { act: amW.act || 'OPD', sup: amW.sup || '' }, pm: { act: pmW.act || 'OPD', sup: pmW.sup || '' } };
    }

    function genICS(evts) {
      const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'CALSCALE:GREGORIAN', 'PRODID:-//GF//EN'];
      evts.forEach(e => {
        L.push('BEGIN:VEVENT');
        L.push(e.allDay ? `DTSTART;VALUE=DATE:${e.s}` : `DTSTART:${e.s}`);
        L.push(e.allDay ? `DTEND;VALUE=DATE:${e.e}` : `DTEND:${e.e}`);
        L.push(`SUMMARY:${e.title}`);
        L.push(`DESCRIPTION:${e.desc || ''}`);
        L.push('END:VEVENT');
      });
      L.push('END:VCALENDAR');
      return L.join('\r\n');
    }

    // ── DATABASE STATE MANAGEMENT ─────────────────────────
    const COL = 'gf_v6';
    const dbKey = id => `gf_db_${COL}_${id}`;
    
    let state = {
      sett: { ...DEF_SETT },
      rotPats: { A: emptyTpl(), B: emptyTpl(), C: emptyTpl() },
      mr: initMR(),
      call: {},
      offDuty: {},
      orLog: [],
      preop: []
    };

    // Firebase Initializer
    let db = null;
    let isOnlineDB = false;

    const firebaseConfig = {
      apiKey: "AIzaSyDei4WwO7zZgnhcINOlyl_FLxKMr1U-uqY",
      authDomain: "glaucoma-fellowship.firebaseapp.com",
      projectId: "glaucoma-fellowship",
      storageBucket: "glaucoma-fellowship.firebasestorage.app",
      messagingSenderId: "687596886857",
      appId: "1:687596886857:web:1e124cf2aa382f05901898"
    };

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true })
          .catch(err => console.warn("Firebase persistence warning:", err));
        isOnlineDB = true;
        console.log("Firebase initialized successfully.");
      } else {
        console.warn("Firebase compatibility library not loaded. Running in local sandbox.");
      }
    } catch (e) {
      console.warn("Firebase failed to initialize. Running in local sandbox.", e);
    }

    function migrateAMPMTemplates() {
      Object.keys(state.mr).forEach(mKey => {
        const wr = state.mr[mKey];
        if (wr.template !== undefined) {
          if (wr.amTemplate === undefined) wr.amTemplate = wr.template;
          if (wr.pmTemplate === undefined) wr.pmTemplate = wr.template;
          delete wr.template;
        } else {
          if (wr.amTemplate === undefined) wr.amTemplate = 'none';
          if (wr.pmTemplate === undefined) wr.pmTemplate = 'none';
        }
      });
    }

    function loadState() {
      try {
        const s = localStorage.getItem(dbKey('settings'));
        if (s) state.sett = { ...DEF_SETT, ...JSON.parse(s) };
        
        const r = localStorage.getItem(dbKey('schedule'));
        if (r) {
          const d = JSON.parse(r);
          state.rotPats = d.rotPats || { A: emptyTpl(), B: emptyTpl(), C: emptyTpl() };
          state.mr = d.mr || initMR();
          migrateAMPMTemplates();
        }
        
        const oc = localStorage.getItem(dbKey('oncall'));
        if (oc) {
          const d = JSON.parse(oc);
          state.call = d.call || {};
          state.offDuty = d.offDuty || {};
        }

        const lb = localStorage.getItem(dbKey('logbook'));
        if (lb) state.orLog = JSON.parse(lb).entries || [];

        const po = localStorage.getItem(dbKey('preop'));
        if (po) state.preop = JSON.parse(po).entries || [];
      } catch(e) {
        console.error("Local database read failed, using defaults", e);
      }
    }

    function initOnlineSync(callback) {
      if (!isOnlineDB) {
        loadState();
        if (callback) callback();
        return;
      }
      
      const docs = ['settings', 'schedule', 'oncall', 'logbook', 'preop'];
      let loadedDocs = 0;
      let hasFinishedInitialLoad = false;
      
      docs.forEach(docId => {
        db.collection(COL).doc(docId).onSnapshot(snap => {
          if (snap.exists) {
            const data = snap.data();
            if (docId === 'settings') {
              state.sett = { ...DEF_SETT, ...data };
            } else if (docId === 'schedule') {
              state.rotPats = data.rotPats || { A: emptyTpl(), B: emptyTpl(), C: emptyTpl() };
              state.mr = data.mr || initMR();
              migrateAMPMTemplates();
            } else if (docId === 'oncall') {
              state.call = data.call || {};
              state.offDuty = data.offDuty || {};
            } else if (docId === 'logbook') {
              state.orLog = data.entries || [];
            } else if (docId === 'preop') {
              state.preop = data.entries || [];
            }
          } else {
            // Create initial document on Cloud Firestore if missing
            writeDocToFirestore(docId);
          }
          
          updateConnectionBadge();
          
          if (!hasFinishedInitialLoad) {
            loadedDocs++;
            if (loadedDocs >= docs.length) {
              hasFinishedInitialLoad = true;
              updateNavLockBadges();
              if (callback) callback();
            }
          } else {
            // Redraw tab when updates sync in real-time
            renderActiveTab();
          }
        }, err => {
          console.error(`Sync error on ${docId}:`, err);
          updateConnectionBadge(err.message);
          // On initial load error, fall back to local storage
          if (!hasFinishedInitialLoad) {
            loadedDocs++;
            if (loadedDocs >= docs.length) {
              hasFinishedInitialLoad = true;
              loadState();
              if (callback) callback();
            }
          }
        });
      });
    }

    function writeDocToFirestore(docId) {
      if (!isOnlineDB) return;
      
      let data = {};
      if (docId === 'settings') {
        data = state.sett;
      } else if (docId === 'schedule') {
        data = { rotPats: state.rotPats, mr: state.mr };
      } else if (docId === 'oncall') {
        data = { call: state.call, offDuty: state.offDuty };
      } else if (docId === 'logbook') {
        data = { entries: state.orLog };
      } else if (docId === 'preop') {
        data = { entries: state.preop };
      }
      
      db.collection(COL).doc(docId).set(data).catch(err => {
        console.error(`Firestore write error on ${docId}:`, err);
        updateConnectionBadge(err.message);
      });
    }

    function saveState() {
      // Local Storage Cache
      try {
        localStorage.setItem(dbKey('settings'), JSON.stringify(state.sett));
        localStorage.setItem(dbKey('schedule'), JSON.stringify({ rotPats: state.rotPats, mr: state.mr }));
        localStorage.setItem(dbKey('oncall'), JSON.stringify({ call: state.call, offDuty: state.offDuty }));
        localStorage.setItem(dbKey('logbook'), JSON.stringify({ entries: state.orLog }));
        localStorage.setItem(dbKey('preop'), JSON.stringify({ entries: state.preop }));
      } catch (e) {
        console.warn("Local storage cache write failed:", e);
      }
      
      // Firestore Sync
      if (isOnlineDB) {
        writeDocToFirestore('settings');
        writeDocToFirestore('schedule');
        writeDocToFirestore('oncall');
        writeDocToFirestore('logbook');
        writeDocToFirestore('preop');
      }
      
      updateNavLockBadges();
    }

    function updateConnectionBadge(errMessage = '') {
      const container = document.getElementById('sync-badge-container');
      if (!container) return;
      
      if (!isOnlineDB) {
        container.innerHTML = `
          <div class="bg-slate-955/85 px-3.5 py-1 rounded-full border border-white/5">
            <span class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold">
              <span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse"></span>Local Sandbox
            </span>
          </div>
        `;
      } else if (errMessage) {
        container.innerHTML = `
          <div class="bg-rose-955/20 px-3.5 py-1 rounded-full border border-rose-900/30">
            <span class="flex items-center gap-1.5 text-xs text-rose-400 font-semibold" title="${errMessage}">
              <span class="w-2.5 h-2.5 bg-rose-500 rounded-full"></span>Offline / Sync Error
            </span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-emerald-955/20 px-3.5 py-1 rounded-full border border-emerald-900/30">
            <span class="flex items-center gap-1.5 text-xs text-emerald-400 font-semibold">
              <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>Firestore Synced
            </span>
          </div>
        `;
      }
    }

    // ── APPLICATION SESSION VARIABLES ─────────────────────
    let session = {
      activeTab: 'summary',
      sMi: 0, // Master Schedule calendar month index
      cMi: 0, // On-call month index
      caseMi: 0, // Cases calendar month index
      caseViewMode: 'table', // 'table' or 'calendar'
      activeRotFellow: 'SS',
      activeRotTmplTab: 'A',
      activeCasesTab: 'logged', // 'logged' or 'preop'
      selectedDate: dStr(new Date()),
      unlocked: false,
      orSearch: '',
      pendingLockTab: null
    };

    // ── APP ROUTER ────────────────────────────────────────
    function switchTab(tabId) {
      const hasPassword = !!(state.sett.appPassword || '');
      const isLockedTab = LOCKED_TABS.includes(tabId);
      
      if (isLockedTab && hasPassword && !session.unlocked) {
        session.pendingLockTab = tabId;
        openPasswordGate();
        return;
      }
      
      session.activeTab = tabId;
      
      // Update Tab Navigation classes
      document.querySelectorAll('nav button').forEach(btn => {
        const ind = btn.querySelector('.nav-indicator');
        const labels = btn.querySelectorAll('span');
        if (btn.id === `nav-btn-${tabId}`) {
          ind.classList.remove('hidden');
          labels[0].classList.add('scale-110', 'drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]');
          labels[0].classList.remove('opacity-65');
          labels[1].classList.add('text-blue-400');
          labels[1].classList.remove('text-slate-500');
        } else {
          ind.classList.add('hidden');
          labels[0].classList.remove('scale-110', 'drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]');
          labels[0].classList.add('opacity-65');
          labels[1].classList.remove('text-blue-400');
          labels[1].classList.add('text-slate-500');
        }
      });
      
      renderActiveTab();
    }

    function openPasswordGate() {
      document.getElementById('gate-passcode-input').value = '';
      document.getElementById('gate-error-message').classList.add('hidden');
      document.getElementById('password-gate-screen').classList.remove('hidden');
      document.getElementById('gate-passcode-input').focus();
    }
    
    function cancelPasswordGate() {
      document.getElementById('password-gate-screen').classList.add('hidden');
      session.pendingLockTab = null;
    }

    // Handles administrative unlock
    function submitPasswordGate() {
      const pw = document.getElementById('gate-passcode-input').value;
      if (pw === state.sett.appPassword) {
        session.unlocked = true;
        document.getElementById('password-gate-screen').classList.add('hidden');
        if (session.pendingLockTab) {
          switchTab(session.pendingLockTab);
          session.pendingLockTab = null;
        } else {
          renderActiveTab();
        }
      } else {
        document.getElementById('gate-error-message').classList.remove('hidden');
      }
    }

    function updateNavLockBadges() {
      const hasPassword = !!(state.sett.appPassword || '');
      const showLock = hasPassword && !session.unlocked;
      LOCKED_TABS.forEach(tId => {
        const btn = document.getElementById(`nav-btn-${tId}`);
        if (btn) {
          const lock = btn.querySelector('.lock-indicator');
          if (showLock) lock.classList.remove('hidden');
          else lock.classList.add('hidden');
        }
      });
    }

    function renderActiveTab() {
      const main = document.getElementById('main-content');
      main.innerHTML = ''; // Clear previous contents

      try {
        switch (session.activeTab) {
          case 'summary':   renderSummary(main);  break;
          case 'rotation':  renderRotation(main); break;
          case 'oncall':    renderOnCall(main);   break;
          case 'cases':     renderCases(main);    break;
          case 'settings':  renderSettings(main); break;
        }
      } catch(err) {
        main.innerHTML = `
          <div style="background:#1e1b4b;border:2px solid #ef4444;border-radius:12px;padding:20px;margin:10px;color:#fca5a5;font-family:monospace;">
            <strong style="color:#f87171;font-size:15px;">⚠️ Render Error — Tab: ${session.activeTab}</strong><br><br>
            <strong>Error:</strong> ${err.message}<br><br>
            <pre style="white-space:pre-wrap;font-size:11px;color:#fcd34d;overflow:auto;max-height:300px">${err.stack}</pre>
          </div>
        `;
        console.error('Tab render error:', err);
      }
    }

    function getCompactActivityLabel(cell) {
      if (!cell) return '';
      const am = cell.am?.act || '';
      const pm = cell.pm?.act || '';
      if (!am && !pm) return '';
      if (am === pm) return am;
      return `${am}/${pm}`;
    }

    function setSummaryViewMode(mode) {
      session.summaryViewMode = mode;
      renderActiveTab();
    }

    // ── SUMMARY TAB ───────────────────────────────────────
    function renderSummary(container) {

    async function sendTodayLINE(fel) {
      const msgEl = document.getElementById('line-notify-msg');
      const { lineWorkerUrl, ssLineId, mnLineId, morningActSched } = state.sett;
      const userId = fel === 'SS' ? ssLineId : mnLineId;
      if (!lineWorkerUrl || !userId) { if(msgEl) msgEl.textContent = '⚠️ Set Worker URL & User IDs in ⚙️ Settings'; return; }
      const t = new Date(), dow = t.getDay();
      if (dow < 1 || dow > 5) { if(msgEl) msgEl.textContent = '⚠️ Not a workday'; return; }
      const y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
      if (isHol(y, m, d)) { if(msgEl) msgEl.textContent = '⚠️ Public holiday'; return; }
      const cell = resolveCell(state.mr, fel, y, m, t);
      const am = cell?.am || { act: '—', sup: '' };
      const pm = cell?.pm || { act: '—', sup: '' };
      const mas = (morningActSched || [])[dow - 1] || '—';
      const dk = dStr(t);
      const duty = state.call[dk]; const off = getOffDutyFellow(dk);
      const isOff = off === fel;
      const isOC = duty === fel || duty?.fellow === fel;
      const msg = `🏥 Glaucoma Fellowship\n👨‍⚕️ Fellow ${fel}\n📅 ${t.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}\n──────────────\n${ isOff ? `📴 OFF DUTY\n   ${getOffDutyReason(dk)||'—'}` : `⏰ 07:00  Ward Round\n⏰ 08:00  ${mas}\n⏰ 09:00  ${am.act}${am.sup?` (${am.sup})`:''}\n⏰ 13:00  ${pm.act}${pm.sup?` (${pm.sup})`:''}`}\n──────────────\n${isOC ? '🌙 ON CALL tonight' : '✅ No night duty'}`;
      if(msgEl) msgEl.textContent = 'Sending…';
      try {
        const r = await fetch(lineWorkerUrl + '/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userId, message: msg }) });
        if(msgEl) msgEl.textContent = r.ok ? '✅ Sent!' : '❌ Failed';
      } catch(e) {
        if(msgEl) msgEl.textContent = '❌ Network error';
      }
      setTimeout(() => { if(msgEl) msgEl.textContent = ''; }, 5000);
    }

    function handleEditFieldUpdate(pathStr, occ, key, val) {
      const parts = pathStr.split('-');
      if (parts[0] === 'tmpl') {
        const tmpl = parts[1], slot = parts[2], di = Number(parts[3]);
        if (!state.rotPats[tmpl][slot][di].wo) state.rotPats[tmpl][slot][di] = emptyCell();
        state.rotPats[tmpl][slot][di].wo[occ][key] = val;
        
        if (key === 'act') {
          const supSelect = document.getElementById(`${pathStr}-${occ}-sup-select`);
          if (val === 'OPD' || val === 'OR') {
            supSelect.classList.remove('hidden');
          } else {
            supSelect.classList.add('hidden');
            state.rotPats[tmpl][slot][di].wo[occ].sup = '';
          }
        }
        
        // Update all months linked to this template for this slot
        Object.keys(state.mr).forEach(mKey => {
          const wr = state.mr[mKey];
          if (slot === 'am' && wr.amTemplate === tmpl) {
            wr.am = JSON.parse(JSON.stringify(state.rotPats[tmpl].am));
          } else if (slot === 'pm' && wr.pmTemplate === tmpl) {
            wr.pm = JSON.parse(JSON.stringify(state.rotPats[tmpl].pm));
          }
        });
      } else {
        // Edit override month cell directly
        const mKey = parts[0] + '-' + parts[1] + '-' + parts[2], slot = parts[3], di = Number(parts[4]);
        if (!state.mr[mKey][slot][di].wo) state.mr[mKey][slot][di] = emptyCell();
        state.mr[mKey][slot][di].wo[occ][key] = val;
        
        if (key === 'act') {
          const supSelect = document.getElementById(`${pathStr}-${occ}-sup-select`);
          if (val === 'OPD' || val === 'OR') {
            supSelect.classList.remove('hidden');
          } else {
            supSelect.classList.add('hidden');
            state.mr[mKey][slot][di].wo[occ].sup = '';
          }
        }
        // Force template unlink for overridden slot
        if (slot === 'am') {
          state.mr[mKey].amTemplate = 'none';
        } else {
          state.mr[mKey].pmTemplate = 'none';
        }
      }
      
      saveState();

      const evts = [];
      MONTHS.forEach(({ y, m }) => {
        const mKey = `${fellow}-${y}-${m}`;
        const wr = state.mr[mKey]; if (!wr) return;
        const totalDays = new Date(y, m + 1, 0).getDate();
        
        for (let d = 1; d <= totalDays; d++) {
          const date = new Date(y, m, d);
          const dow = date.getDay();
          if (dow < 1 || dow > 5 || isHol(y, m, d)) continue;
          
          const cell = resolveCell(state.mr, fellow, y, m, date);
          if (cell) {
            const startDStr = fds(y, m, d);
            
            if (cell.am?.act) {
              evts.push({
                s: startDStr + 'T090000', e: startDStr + 'T120000',
                title: `AM: ${cell.am.act} [${cell.am.sup || 'No Supervisor'}]`,
                desc: `Rotation slot`
              });
            }
            if (cell.pm?.act) {
              evts.push({
                s: startDStr + 'T130000', e: startDStr + 'T160000',
                title: `PM: ${cell.pm.act} [${cell.pm.sup || 'No Supervisor'}]`,
                desc: `Rotation slot`
              });
            }
          }
        }
      });
      
      const ics = genICS(evts);
      downloadFile(ics, `${fellow}_glaucoma_rotation.ics`, 'text/calendar');
    }

      const cur = state.call[ds];

      if (isSSOff && isMNOff) {
        alert("Both fellows are off-duty on this day!");
        return;

      if (!cur) {
        if (!isSSOff) {
          state.call[ds] = 'SS';
        } else {
          state.call[ds] = 'MN';
        }
      } else if (cur === 'SS') {

        const s = { lb, SS: { night: 0, wknd: 0, hol: 0 }, MN: { night: 0, wknd: 0, hol: 0 } };
        for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
          const ds = dStr(new Date(y, m, d)), c = state.call[ds];
          if (c && s[c]) {
            const dow = new Date(y, m, d).getDay();
            const hol = isHol(y, m, d);
            const isWk = dow === 0 || dow === 6;
            
            if (hol) {
              s[c].hol++;
              total[c].hol++;
            } else if (isWk) {

              total[c].wknd++;

    function renderCasesList() {
      const tbody = document.getElementById('cases-list-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const list = session.activeCasesTab === 'logged' ? state.orLog : state.preop;
      const q = session.orSearch.toLowerCase();
      
      const filtered = list.filter(e => {
        if (!q) return true;
        return (e.HN || '').toLowerCase().includes(q) || 
               (e.procedure || '').toLowerCase().includes(q) || 
               (e.supervisor || '').toLowerCase().includes(q) || 
               (e.diagnosis || '').toLowerCase().includes(q) || 
               (e.notes || '').toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${session.activeCasesTab === 'preop' ? 8 : 7}" class="p-8 text-center text-slate-500 font-medium">No case entries match your filters.</td></tr>`;
        return;
      }

      // Sort by date descending
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      filtered.forEach(e => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-900/30 transition-all font-medium';
        
        const dateObj = new Date(e.date + 'T12:00:00');
        const formattedDate = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        
        tr.innerHTML = `
          <td class="p-3 text-slate-300 whitespace-nowrap">${formattedDate}</td>

          <td class="p-3 text-slate-400 truncate max-w-[150px]">${e.diagnosis || '—'}</td>
          <td class="p-3 text-slate-300">${e.supervisor || '—'}</td>
          ${session.activeCasesTab === 'preop' ? `<td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${e.status === 'Ready' ? 'bg-emerald-955 text-emerald-400 border border-emerald-850' : e.status === 'Done' ? 'bg-slate-900 text-slate-400 border border-slate-700' : 'bg-amber-955 text-amber-400 border border-amber-850'}">${e.status || 'Scheduled'}</span></td>` : ''}

    function moveToOR(id) {
      const entry = state.preop.find(e => e.id === id);
      if (!entry) return;
      if (!confirm(`Move ${entry.HN} (${entry.procedure}) to Completed OR Log?`)) return;
      const completed = {
        ...entry,
        id: 'c_' + Math.random().toString(36).substring(2, 9),
        fellow: entry.surgeon || entry.fellow || 'SS',
        date: entry.date
      };
      delete completed.status;
      delete completed.readyForSurgery;
      delete completed.surgeon;
      state.orLog.push(completed);
      state.preop = state.preop.filter(e => e.id !== id);
      saveState();
      renderActiveTab();
    }

    function saveCaseFromModal() {
      const type = document.getElementById('case-edit-type').value;
      const id = document.getElementById('case-edit-id').value;
      
      const date = document.getElementById('case-date').value;
      const hn = document.getElementById('case-hn').value.trim();
      const fellow = document.getElementById('case-fellow').value;
      const laterality = document.getElementById('case-laterality').value;
      const procedure = document.getElementById('case-proc').value;
      const diagnosis = document.getElementById('case-diag').value;
      const supervisor = document.getElementById('case-sup').value;
      const notes = document.getElementById('case-notes').value.trim();
      
      if (!hn) { alert('HN Number is required'); return; }
      
      const entry = {
        id: id || 'c_' + Math.random().toString(36).substring(2, 9),
        date,
        HN: hn,
        laterality,
        procedure,
        diagnosis,
        supervisor,
        notes
      };

      if (type === 'logged') {
        entry.fellow = fellow;
        if (id) {
          state.orLog = state.orLog.map(e => e.id === id ? entry : e);
        } else {
          state.orLog.push(entry);
        }
      } else {
        entry.surgeon = fellow;
        entry.readyForSurgery = document.getElementById('case-ready-for-surgery').checked;
        entry.status = document.getElementById('case-status').value;
        
        if (entry.status === 'Done') {
          // Move to Completed OR List automatically
          if (confirm('Moving status to "Done" will automatically log this as a Completed OR Case. Continue?')) {
            const completed = { ...entry, fellow: entry.surgeon, id: 'c_' + Math.random().toString(36).substring(2, 9) };
            delete completed.status;
            delete completed.readyForSurgery;
            delete completed.surgeon;
            
            state.orLog.push(completed);
            if (id) {
              state.preop = state.preop.filter(e => e.id !== id);
            }
          } else {
            return;
          }
        } else {
          if (id) {
            state.preop = state.preop.map(e => e.id === id ? entry : e);
          } else {
            state.preop.push(entry);
          }
        }
      }

      saveState();
      closeCaseModal();
      renderActiveTab();
    }

    function editCase(id) {
      let entry = state.orLog.find(e => e.id === id);
      let type = 'logged';
      if (!entry) {
        entry = state.preop.find(e => e.id === id);
        type = 'preop';
      }
      if (!entry) return;
      session.activeCasesTab = type;

      document.getElementById('case-edit-id').value = id;
      document.getElementById('case-edit-type').value = type;
      
      document.getElementById('case-modal-title').innerText = type === 'logged' ? 'Edit Completed Surgical Case' : 'Edit Pre-Op Case';
      document.getElementById('case-date').value = entry.date;
      document.getElementById('case-hn').value = entry.HN;
      document.getElementById('case-fellow').value = entry.fellow || entry.surgeon || 'SS';
      document.getElementById('case-laterality').value = entry.laterality || 'OD';
      document.getElementById('case-notes').value = entry.notes || '';
      
      populateSelectOptions();
      document.getElementById('case-proc').value = entry.procedure;
      document.getElementById('case-diag').value = entry.diagnosis;
      document.getElementById('case-sup').value = entry.supervisor;

      const preopFields = document.getElementById('preop-extra-fields');
      if (type === 'preop') {
        preopFields.classList.remove('hidden');
        document.getElementById('case-ready-for-surgery').checked = !!entry.readyForSurgery;
        document.getElementById('case-status').value = entry.status || 'Scheduled';
      } else {
        preopFields.classList.add('hidden');
      }

      document.getElementById('case-log-modal').classList.remove('hidden');
    }

    function deleteCase(id) {
      if (confirm('Are you sure you want to permanently delete this case?')) {
        const isLogged = state.orLog.some(e => e.id === id);
        if (isLogged) {
          state.orLog = state.orLog.filter(e => e.id !== id);
        } else {
          state.preop = state.preop.filter(e => e.id !== id);
        }
        saveState();
        renderActiveTab();
      }
    }

    function getCaseStats() {
      const stats = { SS: { total: 0, byProc: {} }, MN: { total: 0, byProc: {} } };
      state.orLog.forEach(e => {
        const f = e.fellow;
        if (stats[f]) {
          stats[f].total++;
          stats[f].byProc[e.procedure] = (stats[f].byProc[e.procedure] || 0) + 1;
        }
      });
      return stats;

    function exportMultiSheetExcel() {
      let xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 <DocumentProperties xmlns="urn:schemas-microsoft-com:office:office">
  <Author>Glaucoma Fellowship Portal</Author>
  <Created>${new Date().toISOString()}</Created>
 </DocumentProperties>
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Bottom"/>
   <Borders/>
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Color="#000000"/>
   <Interior/>
   <NumberFormat/>
   <Protection/>
  </Style>
  <Style ss:ID="Header">
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>
   <Interior ss:Color="#1F4E78" ss:Pattern="Solid"/>
  </Style>
  <Style ss:ID="DateStyle">
   <NumberFormat ss:Format="yyyy\-mm\-dd"/>
  </Style>
 </Styles>`;

      const escapeXML = (str) => {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      };

      const createWorksheet = (name, headers, rows) => {
        let s = `\n <Worksheet ss:Name="${escapeXML(name)}">\n  <Table>\n`;
        s += '   <Row ss:StyleID="Header">\n';
        headers.forEach(h => {
          s += `    <Cell><Data ss:Type="String">${escapeXML(h)}</Data></Cell>\n`;
        });
        s += '   </Row>\n';

        rows.forEach(r => {
          s += '   <Row>\n';
          r.forEach(val => {
            let type = 'String';
            let styleAttr = '';
            if (typeof val === 'number') {
              type = 'Number';
            } else if (val instanceof Date) {
              type = 'DateTime';
              val = val.toISOString().substring(0, 10);
              styleAttr = ' ss:StyleID="DateStyle"';
            }
            s += `    <Cell${styleAttr}><Data ss:Type="${type}">${escapeXML(val)}</Data></Cell>\n`;
          });
          s += '   </Row>\n';
        });

        s += '  </Table>\n </Worksheet>';
        return s;
      };

      // 1. OR Log Worksheet
      const orHeaders = ['Date', 'HN', 'Fellow', 'Procedure', 'Diagnosis', 'Laterality', 'Supervisor', 'Notes'];
      const orRows = state.orLog.map(r => [
        r.date || '',
        r.HN || '',
        r.fellow || '',
        r.procedure || '',
        r.diagnosis || '',
        r.laterality || '',
        r.supervisor || '',
        r.notes || ''
      ]);
      xml += createWorksheet('OR Log', orHeaders, orRows);

      // 2. Pre-Op List Worksheet
      const preopHeaders = ['Date', 'HN', 'Surgeon', 'Procedure', 'Diagnosis', 'Laterality', 'Supervisor', 'Status', 'Notes'];
      const preopRows = state.preop.map(r => [
        r.date || '',
        r.HN || '',
        r.surgeon || '',
        r.procedure || '',
        r.diagnosis || '',
        r.laterality || '',
        r.supervisor || '',
        r.status || '',
        r.notes || ''
      ]);
      xml += createWorksheet('Pre-Op List', preopHeaders, preopRows);

      // 3. On-Call & Off-Duty Worksheet
      const allDates = new Set([...Object.keys(state.call), ...Object.keys(state.offDuty)]);
      const callHeaders = ['Date', 'On-Call Fellow', 'Off-Duty Fellow'];
      const callRows = Array.from(allDates)
        .sort()
        .map(ds => [
          ds,
          state.call[ds] || '',
          getOffDutyFellow(ds) || ''
        ]);
      xml += createWorksheet('On-Call & Off-Duty', callHeaders, callRows);

      // 4. Rotation Schedule Worksheet
      const rotHeaders = ['Date', 'Fellow', 'AM Activity', 'AM Supervisor', 'PM Activity', 'PM Supervisor'];
      const rotRows = [];
      MONTHS.forEach(({ y, m }) => {
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(y, m, d);
          const dow = date.getDay();
          if (dow >= 1 && dow <= 5) {
            const ds = dStr(date);
            ['SS', 'MN'].forEach(fel => {
              const resolved = resolveCell(state.mr, fel, y, m, date);
              if (resolved) {
                rotRows.push([
                  ds,
                  fel,
                  resolved.am.act,
                  resolved.am.sup,
                  resolved.pm.act,
                  resolved.pm.sup
                ]);
              }
            });
          }
        }
      });
      xml += createWorksheet('Rotation Schedule', rotHeaders, rotRows);

      // 5. Settings & Targets Worksheet
      const settingsHeaders = ['Procedure / Config Name', 'Target / Value', 'Description'];
      const settingsRows = [];
      Object.entries(state.sett.targets || {}).forEach(([proc, tgt]) => {
        settingsRows.push([`Target: ${proc}`, tgt, 'Surgical minimum cases target']);
      });
      if (state.sett.procs) {
        settingsRows.push(['Procedures List', state.sett.procs.join(', '), 'Configured procedures']);
      }
      if (state.sett.sups) {
        settingsRows.push(['Supervisors List', state.sett.sups.join(', '), 'Configured supervisor names']);
      }
      xml += createWorksheet('Settings & Targets', settingsHeaders, settingsRows);

      xml += '\n</Workbook>';

      const dateStr = new Date().toISOString().slice(0, 10);
      downloadFile(xml, `Fellowship_Backup_${dateStr}.xls`, 'application/vnd.ms-excel');
    }

    function importJSONState(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.sett) state.sett = imported.sett;
          if (imported.rotPats) state.rotPats = imported.rotPats;
          if (imported.mr) state.mr = imported.mr;
          if (imported.call) state.call = imported.call;
          if (imported.offDuty) state.offDuty = imported.offDuty;
          if (imported.orLog) state.orLog = imported.orLog;
          if (imported.preop) state.preop = imported.preop;

          saveState();
          alert('✅ Database imported successfully!');
          renderActiveTab();
        } catch (err) {
          alert('❌ Invalid JSON backup file');
          console.error(err);
        }
      };
      reader.readAsText(file);
    }

        alert('Database reset successful.');
        renderActiveTab();
      }
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement("a");
      const file = new Blob([content], { type: contentType });
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Generates a dedicated monthly print layout based on resolved shifts
    function printRotation() {
      const activeFel = session.activeRotFellow;
      const { y, m, lb } = MONTHS[session.sMi];
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      
      let html = `
        <div style="font-family: 'Inter', sans-serif; padding: 20px; color: black; background: white;">
          <h1 style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 2px;">Glaucoma Fellowship Rotation Plan</h1>

          <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px;">
            <thead>
              <tr style="background: #f1f5f9; border: 1px solid #cbd5e1;">
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; width: 80px;">Date</th>
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; width: 60px;">Day</th>
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: left;">08:00–09:00 (Morning Session)</th>
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: left; width: 180px;">AM Slot (09:00–12:00)</th>
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: left; width: 180px;">PM Slot (13:00–16:00)</th>
                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; width: 80px;">On-Call</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(y, m, d);
        const dow = date.getDay();
        const isWk = dow === 0 || dow === 6;
        const hol = isHol(y, m, d);
        const holName = TH_HOL[hk(y, m, d)];
        
        const cell = resolveCell(state.mr, activeFel, y, m, date);
        const morningAct = (state.sett.morningActSched || [])[dow - 1] || '—';
        const dKey = dStr(date);
        const isOnCall = state.call[dKey] === activeFel;
        const isOffDuty = getOffDutyFellow(dKey) === activeFel;
        
        let rowBg = 'background: white;';
        if (hol) {
          rowBg = 'background: #ffe4e6;'; // Rose 100 for holidays
        } else if (isWk) {
          rowBg = 'background: #f8fafc; color: #64748b;'; // Slate 50 for weekends
        }
        
        let amText = '—';
        let pmText = '—';
        if (!isWk && !hol && cell) {
          amText = `<b>${cell.am?.act || 'OPD'}</b>${cell.am?.sup ? ` (${cell.am.sup})` : ''}`;
          pmText = `<b>${cell.pm?.act || 'OPD'}</b>${cell.pm?.sup ? ` (${cell.pm.sup})` : ''}`;
        } else if (isWk) {
          amText = 'Weekend';
          pmText = 'Weekend';
        } else if (hol) {
          amText = holName || 'Public Holiday';
          pmText = holName || 'Public Holiday';
        }
        
        if (isOffDuty) {
          amText = '<span style="color: #ef4444; font-weight: bold;">OFF DUTY</span>';
          pmText = '<span style="color: #ef4444; font-weight: bold;">OFF DUTY</span>';
        }
        
        const formattedDate = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
        
        html += `
          <tr style="${rowBg} border: 1px solid #e2e8f0;">
            <td style="border: 1px solid #e2e8f0; padding: 6px; text-align: center; font-weight: 700;">${formattedDate}</td>
            <td style="border: 1px solid #e2e8f0; padding: 6px; text-align: center;">${dayNames[dow]}</td>
            <td style="border: 1px solid #e2e8f0; padding: 6px;">${(isWk || hol) ? '—' : morningAct}</td>
            <td style="border: 1px solid #e2e8f0; padding: 6px;">${amText}</td>
            <td style="border: 1px solid #e2e8f0; padding: 6px;">${pmText}</td>
            <td style="border: 1px solid #e2e8f0; padding: 6px; text-align: center; font-weight: 700;">
              ${isOnCall ? '<span style="color: #4f46e5;">ON-CALL</span>' : '—'}
            </td>
          </tr>
        `;
      }
      
      html += `
            </tbody>
          </table>
        </div>
      `;
      
      document.getElementById('print-preview-area').innerHTML = html;
      window.print();
    }

    // ── DATE FORMATTER ────────────────────────────────────
    function dateThaiString(d) {
      return d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function mkCalDays(mi) {
      const { y, m } = MONTHS[mi]; 
      const f = new Date(y, m, 1), d = [];
      const lead = f.getDay() === 0 ? 6 : f.getDay() - 1;
      for (let i = 0; i < lead; i++) d.push(null);
      for (let n = 1; n <= new Date(y, m + 1, 0).getDate(); n++) d.push(new Date(y, m, n));
      return d;
    }

    // ── APP STARTUP ───────────────────────────────────────
    window.addEventListener('load', () => {
      try {
        // Initialize Firestore online sync, then switch tab
        initOnlineSync(() => {
          updateConnectionBadge();
          switchTab('summary');
          updateNavLockBadges();
        });
        
        // Theme support
        window.toggleTheme = function() {
          const isLight = document.body.classList.toggle('light-theme');
          localStorage.setItem('gf_theme', isLight ? 'light' : 'dark');
          updateThemeButton();
        };
        window.updateThemeButton = function() {
          const btn = document.getElementById('theme-toggle-btn');
          if (!btn) return;
          const isLight = document.body.classList.contains('light-theme');
          btn.innerHTML = isLight ? '☀️' : '🌙';
        };
        
        // Load theme
        const savedTheme = localStorage.getItem('gf_theme');
        if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }
        updateThemeButton();
      } catch(err) {
        // Show error visibly on screen for debugging
        const main = document.getElementById('main-content');
        if (main) {
          main.innerHTML = `
            <div style="background:#1e1b4b;border:2px solid #ef4444;border-radius:12px;padding:20px;margin:20px;color:#fca5a5;font-family:monospace;">
              <strong style="color:#f87171;font-size:16px;">⚠️ App Startup Error</strong><br><br>
              <strong>Error:</strong> ${err.message}<br>
              <strong>Stack:</strong><br><pre style="white-space:pre-wrap;font-size:11px;color:#fcd34d">${err.stack}</pre>
            </div>
          `;
        }
        console.error('App startup error:', err);
      }
    });  </script>
</body>
</html>
